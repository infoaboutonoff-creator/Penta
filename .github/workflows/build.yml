          import android.widget.FrameLayout
          import android.widget.LinearLayout
          import android.widget.Toast
          import kotlin.math.abs
          import kotlin.math.max

          class OverlayService : Service(), SharedPreferences.OnSharedPreferenceChangeListener {

              companion object {
                  const val ACTION_STOP = "com.example.screenpen.STOP"
                  private const val CHANNEL_ID = "screen_pen"
                  @Volatile var running = false
              }

              lateinit var wm: WindowManager
              lateinit var tc: Context
              private lateinit var p: Prefs
              private lateinit var doc: Doc
              private val handler = Handler(Looper.getMainLooper())

              private var dv: DrawView? = null
              private lateinit var drawParams: WindowManager.LayoutParams
              private var bar: LinearLayout? = null
              private lateinit var barParams: WindowManager.LayoutParams
              private var timer: TimerOverlay? = null

              private var interact = false
              private var hidden = false
              private var collapsed = false
              private var orient = "h"
              private var lastTool = DrawView.Tool.PEN
              private var undoView: View? = null
              private var redoView: View? = null

              private var panelRoot: FrameLayout? = null
              private var panelDismiss: (() -> Unit)? = null

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (intent?.action == ACTION_STOP) {
                      stopSelf()
                      return START_NOT_STICKY
                  }
                  if (!running) {
                      startAsForeground()
                      setup()
                      running = true
                  }
                  return START_NOT_STICKY
              }

              private fun startAsForeground() {
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(NotificationChannel(CHANNEL_ID, "ScreenPen", NotificationManager.IMPORTANCE_LOW))
                  val stop = PendingIntent.getService(
                      this, 0, Intent(this, OverlayService::class.java).setAction(ACTION_STOP), PendingIntent.FLAG_IMMUTABLE
                  )
                  val open = PendingIntent.getActivity(this, 1, Intent(this, MainActivity::class.java), PendingIntent.FLAG_IMMUTABLE)
                  val n = Notification.Builder(this, CHANNEL_ID)
                      .setContentTitle("ScreenPen is on")
                      .setContentText("Tap to open settings")
                      .setSmallIcon(android.R.drawable.ic_menu_edit)
                      .setContentIntent(open)
                      .setOngoing(true)
                      .addAction(
                          Notification.Action.Builder(Icon.createWithResource(this, android.R.drawable.ic_delete), "Stop", stop).build()
                      )
                      .build()
                  if (Build.VERSION.SDK_INT >= 34) startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE)
                  else startForeground(1, n)
              }

              // ------------------------------------------------------------------ setup
              private fun setup() {
                  wm = getSystemService(WINDOW_SERVICE) as WindowManager
                  tc = ContextThemeWrapper(this, android.R.style.Theme_Material)
                  p = Prefs.get(this)
                  doc = if (p.bool(K.AUTOSAVE)) Store.load(this) else Doc()
                  orient = if (p.str(K.START_ORIENT) == "last") p.str(K.LAST_ORIENT) else p.str(K.START_ORIENT)

                  val v = DrawView(this)
                  v.doc = doc
                  v.onCommit = { scheduleSave(); handler.post { refreshUndo() } }
                  v.onEraseDone = { if (p.bool(K.ER_AUTO)) handler.post { setTool(lastTool) } }
                  dv = v
                  applyDraw()
                  drawParams = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.MATCH_PARENT, WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                          WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      PixelFormat.TRANSLUCENT
                  )
                  wm.addView(v, drawParams)

                  timer = TimerOverlay(this)
                  if (p.bool(K.TM_ON)) timer?.show()

                  val b = LinearLayout(this)
                  bar = b
                  barParams = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT, WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = dpi(p.int(K.TB_X)); y = dpi(p.int(K.TB_Y))
                  }
                  rebuildBar()
                  wm.addView(b, barParams)
                  p.sp.registerOnSharedPreferenceChangeListener(this)
              }

              private fun applyDraw() {
                  val v = dv ?: return
                  v.penColor = p.int(K.PEN_COLOR)
                  v.penW = dp(p.int(K.PEN_W).toFloat())
                  v.hlW = dp(p.int(K.HL_W).toFloat())
                  v.erArea = p.str(K.ER_TYPE) == "area"
                  v.erW = dp(p.int(K.ER_W).toFloat())
                  v.straighten = p.bool(K.STRAIGHT)
                  v.palm = p.str(K.PALM)
              }

              override fun onSharedPreferenceChanged(sp: SharedPreferences?, key: String?) {
                  if (dv == null || key == null) return
                  when (key) {
                      K.PEN_COLOR, K.PEN_W -> { applyDraw(); handler.post { rebuildBar() } }
                      K.HL_W, K.ER_TYPE, K.ER_W, K.STRAIGHT, K.PALM -> applyDraw()
                      K.TB_ITEMS, K.TB_SIZE, K.TB_ALPHA, K.TB_COLOR -> handler.post { rebuildBar() }
                      else -> if (key.startsWith("tm") && key != K.TM_X && key != K.TM_Y && key != K.TM_ON) timer?.applyStyle()
                  }
              }

              // ------------------------------------------------------------------ helpers
              fun screen(): Point {
                  val pt = Point()
                  @Suppress("DEPRECATION")
                  wm.defaultDisplay.getRealSize(pt)
                  return pt
              }

              fun attachDrag(
                  v: View, lp: WindowManager.LayoutParams, root: View,
                  onTap: () -> Unit, onLong: (() -> Unit)?, onDone: () -> Unit
              ) {
                  val slop = ViewConfiguration.get(this).scaledTouchSlop
                  var dx = 0f; var dy = 0f; var sx = 0; var sy = 0
                  var moved = false; var longFired = false
                  val longRun = Runnable { longFired = true; onLong?.invoke() }
                  v.setOnTouchListener { _, e ->
                      when (e.actionMasked) {
                          MotionEvent.ACTION_DOWN -> {
                              dx = e.rawX; dy = e.rawY; sx = lp.x; sy = lp.y
                              moved = false; longFired = false
                              if (onLong != null) handler.postDelayed(longRun, 450)
                          }
                          MotionEvent.ACTION_MOVE -> {
                              if (!moved && (abs(e.rawX - dx) > slop || abs(e.rawY - dy) > slop)) {
                                  moved = true; handler.removeCallbacks(longRun)
                              }
                              if (moved) {
                                  val s = screen()
                                  lp.x = (sx + (e.rawX - dx).toInt()).coerceIn(0, max(0, s.x - root.width))
                                  lp.y = (sy + (e.rawY - dy).toInt()).coerceIn(0, max(0, s.y - root.height))
                                  runCatching { wm.updateViewLayout(root, lp) }
                              }
                          }
                          MotionEvent.ACTION_UP -> {
                              handler.removeCallbacks(longRun)
                              if (moved) onDone() else if (!longFired) onTap()
                          }
                          MotionEvent.ACTION_CANCEL -> handler.removeCallbacks(longRun)
                      }
                      true
                  }
              }

              private val saveRun = Runnable { if (p.bool(K.AUTOSAVE)) Store.saveAsync(this, doc) }
              private fun scheduleSave() {
                  handler.removeCallbacks(saveRun)
                  handler.postDelayed(saveRun, 1500)
              }

              private fun updateTouchMode() {
                  val v = dv ?: return
                  val off = WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE
                  drawParams.flags = if (interact || hidden) drawParams.flags or off else drawParams.flags and off.inv()
                  runCatching { wm.updateViewLayout(v, drawParams) }
              }

              private fun setTool(t: DrawView.Tool) {
                  
