name: Build ScreenPen APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: File settings.gradle.kts
        run: |
          mkdir -p ScreenPen && cd ScreenPen
          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "ScreenPen"
          include(":app")
          EOF
      - name: File build.gradle.kts
        run: |
          mkdir -p ScreenPen && cd ScreenPen
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
      - name: File gradle.properties
        run: |
          mkdir -p ScreenPen && cd ScreenPen
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=true
          EOF
      - name: File app/build.gradle.kts
        run: |
          mkdir -p ScreenPen && cd ScreenPen
          mkdir -p app
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.screenpen"
              compileSdk = 34

              signingConfigs {
                  create("rel") {
                      storeFile = file("../rel.jks")
                      storePassword = "android123"
                      keyAlias = "key0"
                      keyPassword = "android123"
                  }
              }
              buildTypes {
                  release {
                      signingConfig = signingConfigs.getByName("rel")
                      isMinifyEnabled = false
                  }
                  getByName("debug") {
                      signingConfig = signingConfigs.getByName("rel")
                  }
              }

              defaultConfig {
                  applicationId = "com.abcstudy.screenpen"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 2
                  versionName = "2.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF
      - name: File app/src/main/AndroidManifest.xml
        run: |
          mkdir -p ScreenPen && cd ScreenPen
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.VIBRATE" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="ScreenPen"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <activity
                      android:name=".TileActivity"
                      android:exported="false"
                      android:excludeFromRecents="true"
                      android:taskAffinity=""
                      android:theme="@android:style/Theme.Translucent.NoTitleBar" />

                  <service
                      android:name=".OverlayService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="screen_annotation" />
                  </service>

                  <service
                      android:name=".PenTileService"
                      android:exported="true"
                      android:icon="@android:drawable/ic_menu_edit"
                      android:label="ScreenPen"
                      android:permission="android.permission.BIND_QUICK_SETTINGS_TILE">
                      <intent-filter>
                          <action android:name="android.service.quicksettings.action.QS_TILE" />
                      </intent-filter>
                  </service>

              </application>
          </manifest>
          EOF
      - name: File app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
        run: |
          mkdir -p ScreenPen && cd ScreenPen
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_bg" />
              <foreground android:drawable="@drawable/ic_launcher_fg" />
          </adaptive-icon>
          EOF
      - name: File app/src/main/res/drawable/ic_launcher_bg.xml
        run: |
          mkdir -p ScreenPen && cd ScreenPen
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/ic_launcher_bg.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#2F6BFF" />
          </shape>
          EOF
      - name: File app/src/main/res/drawable/ic_launcher_fg.xml
        run: |
          mkdir -p ScreenPen && cd ScreenPen
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/ic_launcher_fg.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M34,74 L37.5,60 L65,32.5 L75.5,43 L48,70.5 Z" />
              <path
                  android:fillColor="#00000000"
                  android:strokeColor="#FFFFFF"
                  android:strokeWidth="3.5"
                  android:strokeLineCap="round"
                  android:pathData="M34,78 C44,84 52,76 62,80 C68,82 72,80 76,78" />
          </vector>
          EOF
      - name: File app/src/main/java/com/example/screenpen/Ui.kt
        run: |
          mkdir -p ScreenPen && cd ScreenPen
          mkdir -p app/src/main/java/com/example/screenpen
          cat > app/src/main/java/com/example/screenpen/Ui.kt <<'EOF'
          package com.example.screenpen

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.DashPathEffect
          import android.graphics.Paint
          import android.graphics.Path
          import android.graphics.RectF
          import android.graphics.drawable.GradientDrawable
          import android.view.View
          import kotlin.math.cos
          import kotlin.math.hypot
          import kotlin.math.min
          import kotlin.math.roundToInt
          import kotlin.math.sin

          object C {
              val ACCENT = 0xFF2F6BFF.toInt()
              val BG = 0xFFF3F5F9.toInt()
              val CARD = 0xFFFFFFFF.toInt()
              val INK = 0xFF1B2433.toInt()
              val SUB = 0xFF6B7588.toInt()
              val LINE = 0xFFE3E8F0.toInt()
              val DANGER = 0xFFE5484D.toInt()
              val BAR = 0xFF1E2430.toInt()
              val PANEL = 0xFF262D3B.toInt()
              val PANEL_ITEM = 0xFF343C4D.toInt()
              val ON_DARK = 0xFFE8ECF4.toInt()
              val PALETTE = intArrayOf(
                  0xFF111111.toInt(), 0xFFFFFFFF.toInt(), 0xFFE5333A.toInt(), 0xFFFF7A1A.toInt(),
                  0xFFF5C400.toInt(), 0xFF7ED321.toInt(), 0xFF1A9E4B.toInt(), 0xFF00B8A9.toInt(),
                  0xFF00B0FF.toInt(), 0xFF2F6BFF.toInt(), 0xFF6C4DFF.toInt(), 0xFFB44DFF.toInt(),
                  0xFFFF4DA6.toInt(), 0xFF8B5A2B.toInt(), 0xFF7A8699.toInt(), 0xFFFFC8A6.toInt()
              )
          }

          fun Context.dp(v: Float): Float = v * resources.displayMetrics.density
          fun Context.dpi(v: Int): Int = (v * resources.displayMetrics.density).roundToInt()

          fun roundBg(color: Int, radius: Float, stroke: Int = 0, strokeW: Float = 0f): GradientDrawable =
              GradientDrawable().apply {
                  setColor(color)
                  cornerRadius = radius
                  if (stroke != 0) setStroke(strokeW.roundToInt().coerceAtLeast(1), stroke)
              }

          fun withAlpha(color: Int, a: Int): Int = (color and 0x00FFFFFF) or (a.coerceIn(0, 255) shl 24)

          enum class Ic {
              PEN, ERASER, UNDO, REDO, EYE, EYE_OFF, SELECT, ORIENT, HL, SHAPES, PAGES, LASER, TIMER,
              SAVE, TRASH, CLOSE, CURSOR, LOCK, UNLOCK, RESIZE, BACK, CHEV_R, CHEV_U, CHEV_D, PLUS, MINUS,
              PLAY, PAUSE, NEXT, RESET, LINE, RECT, OVAL, ARROW, GRIP, CHECK, TOOLBAR
          }

          object Icons {
              private val cache = HashMap<Ic, Path>()
              private val paint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.STROKE
                  strokeCap = Paint.Cap.ROUND
                  strokeJoin = Paint.Join.ROUND
              }
              private val dash = DashPathEffect(floatArrayOf(2.4f, 2.4f), 0f)

              fun draw(c: Canvas, ic: Ic, cx: Float, cy: Float, size: Float, color: Int, sw: Float = 1.8f) {
                  val p = cache.getOrPut(ic) { build(ic) }
                  paint.color = color
                  paint.strokeWidth = sw
                  paint.pathEffect = if (ic == Ic.SELECT) dash else null
                  c.save()
                  c.translate(cx - size / 2f, cy - size / 2f)
                  val s = size / 24f
                  c.scale(s, s)
                  if (ic == Ic.REDO) {
                      c.scale(-1f, 1f)
                      c.translate(-24f, 0f)
                  }
                  c.drawPath(p, paint)
                  c.restore()
              }

              private fun Path.pl(vararg v: Float, close: Boolean = false): Path {
                  moveTo(v[0], v[1])
                  var i = 2
                  while (i < v.size) { lineTo(v[i], v[i + 1]); i += 2 }
                  if (close) close()
                  return this
              }

              private fun Path.head(tx: Float, ty: Float, dx: Float, dy: Float, len: Float = 4.5f) {
                  val l = hypot(dx, dy)
                  val ux = -dx / l
                  val uy = -dy / l
                  for (a in floatArrayOf(0.6f, -0.6f)) {
                      val ca = cos(a)
                      val sa = sin(a)
                      moveTo(tx, ty)
                      lineTo(tx + (ux * ca - uy * sa) * len, ty + (ux * sa + uy * ca) * len)
                  }
              }

              private fun Path.arcArrow(startDeg: Float, sweep: Float) {
                  addArc(RectF(5f, 5f, 19f, 19f), startDeg, sweep)
                  val a = Math.toRadians((startDeg + sweep).toDouble())
                  val ex = 12f + 7f * cos(a).toFloat()
                  val ey = 12f + 7f * sin(a).toFloat()
                  head(ex, ey, (-sin(a)).toFloat(), cos(a).toFloat())
              }

              private fun build(ic: Ic): Path = Path().apply {
                  when (ic) {
                      Ic.PEN -> { pl(4f, 20f, 5f, 15f, 16f, 4f, 20f, 8f, 9f, 19f, close = true); pl(14f, 6f, 18f, 10f) }
                      Ic.ERASER -> { pl(5f, 14f, 14f, 5f, 20f, 11f, 11f, 20f, close = true); pl(9.5f, 9.5f, 15.5f, 15.5f); pl(11f, 20f, 20f, 20f) }
                      Ic.UNDO, Ic.REDO -> {
                          pl(9f, 14f, 4f, 9f, 9f, 4f)
                          moveTo(4f, 9f); lineTo(14f, 9f)
                          cubicTo(17.5f, 9f, 20f, 11f, 20f, 14f)
                          cubicTo(20f, 17f, 17.5f, 19f, 14f, 19f)
                          lineTo(10f, 19f)
                      }
                      Ic.EYE, Ic.EYE_OFF -> {
                          moveTo(2f, 12f)
                          cubicTo(5f, 6.5f, 8.5f, 5f, 12f, 5f)
                          cubicTo(15.5f, 5f, 19f, 6.5f, 22f, 12f)
                          cubicTo(19f, 17.5f, 15.5f, 19f, 12f, 19f)
                          cubicTo(8.5f, 19f, 5f, 17.5f, 2f, 12f)
                          close()
                          addCircle(12f, 12f, 3f, Path.Direction.CW)
                          if (ic == Ic.EYE_OFF) pl(4f, 20f, 20f, 4f)
                      }
                      Ic.SELECT -> addRect(4f, 4f, 20f, 20f, Path.Direction.CW)
                      Ic.ORIENT -> arcArrow(-50f, 270f)
                      Ic.RESET -> arcArrow(-60f, 290f)
                      Ic.HL -> { pl(6f, 15f, 14f, 7f, 18f, 11f, 10f, 19f, close = true); pl(10f, 19f, 4f, 20f, 6f, 15f) }
                      Ic.SHAPES -> { addRect(3f, 3f, 13f, 13f, Path.Direction.CW); addCircle(15.5f, 15.5f, 5.5f, Path.Direction.CW) }
                      Ic.PAGES -> { addRect(8f, 3f, 20f, 16f, Path.Direction.CW); pl(4f, 7f, 4f, 21f, 16f, 21f) }
                      Ic.LASER -> {
                          addCircle(12f, 12f, 3f, Path.Direction.CW)
                          for (i in 0 until 8) {
                              val a = Math.toRadians(i * 45.0)
                              pl(12f + 6f * cos(a).toFloat(), 12f + 6f * sin(a).toFloat(), 12f + 9.5f * cos(a).toFloat(), 12f + 9.5f * sin(a).toFloat())
                          }
                      }
                      Ic.TIMER -> { addCircle(12f, 12f, 9f, Path.Direction.CW); pl(12f, 7f, 12f, 12f, 15.5f, 14f) }
                      Ic.SAVE -> { pl(12f, 4f, 12f, 15f); head(12f, 15f, 0f, 1f); pl(5f, 15f, 5f, 19f, 19f, 19f, 19f, 15f) }
                      Ic.TRASH -> {
                          pl(4f, 7f, 20f, 7f); pl(9f, 7f, 9f, 4f, 15f, 4f, 15f, 7f)
                          pl(6f, 7f, 7f, 20f, 17f, 20f, 18f, 7f); pl(10f, 11f, 10f, 16f); pl(14f, 11f, 14f, 16f)
                      }
                      Ic.CLOSE -> { pl(6f, 6f, 18f, 18f); pl(18f, 6f, 6f, 18f) }
                      Ic.CURSOR -> pl(6f, 3f, 6f, 19f, 10.5f, 15f, 14f, 21f, 16.5f, 19.5f, 13f, 14f, 18.5f, 13.5f, close = true)
                      Ic.LOCK -> {
                          addRoundRect(RectF(6f, 11f, 18f, 21f), 2f, 2f, Path.Direction.CW)
                          moveTo(8.5f, 11f); lineTo(8.5f, 8f); arcTo(RectF(8.5f, 4.5f, 15.5f, 11.5f), 180f, 180f, false); lineTo(15.5f, 11f)
                      }
                      Ic.UNLOCK -> {
                          addRoundRect(RectF(6f, 11f, 18f, 21f), 2f, 2f, Path.Direction.CW)
                          moveTo(8.5f, 11f); lineTo(8.5f, 6f); arcTo(RectF(8.5f, 2.5f, 15.5f, 9.5f), 180f, 180f, false); lineTo(15.5f, 7.5f)
                      }
                      Ic.RESIZE -> { pl(6f, 18f, 18f, 6f); head(18f, 6f, 1f, -1f); head(6f, 18f, -1f, 1f) }
                      Ic.BACK -> pl(15f, 5f, 8f, 12f, 15f, 19f)
                      Ic.CHEV_R -> pl(9f, 5f, 16f, 12f, 9f, 19f)
                      Ic.CHEV_U -> pl(5f, 15f, 12f, 8f, 19f, 15f)
                      Ic.CHEV_D -> pl(5f, 9f, 12f, 16f, 19f, 9f)
                      Ic.PLUS -> { pl(12f, 5f, 12f, 19f); pl(5f, 12f, 19f, 12f) }
                      Ic.MINUS -> pl(5f, 12f, 19f, 12f)
                      Ic.PLAY -> pl(8f, 5f, 19f, 12f, 8f, 19f, close = true)
                      Ic.PAUSE -> { pl(9f, 5f, 9f, 19f); pl(15f, 5f, 15f, 19f) }
                      Ic.NEXT -> { pl(6f, 5f, 14f, 12f, 6f, 19f, close = true); pl(18f, 5f, 18f, 19f) }
                      Ic.LINE -> pl(5f, 19f, 19f, 5f)
                      Ic.RECT -> addRect(4f, 6f, 20f, 18f, Path.Direction.CW)
                      Ic.OVAL -> addOval(RectF(3f, 6f, 21f, 18f), Path.Direction.CW)
                      Ic.ARROW -> { pl(5f, 19f, 19f, 5f); head(19f, 5f, 1f, -1f, 6f) }
                      Ic.GRIP -> {
                          for (x in floatArrayOf(9f, 15f)) for (y in floatArrayOf(6f, 12f, 18f)) addCircle(x, y, 1.1f, Path.Direction.CW)
                      }
                      Ic.CHECK -> pl(5f, 12f, 10f, 17f, 19f, 7f)
                      Ic.TOOLBAR -> {
                          addRoundRect(RectF(3f, 8f, 21f, 16f), 3f, 3f, Path.Direction.CW)
                          addCircle(8f, 12f, 0.8f, Path.Direction.CW); addCircle(12f, 12f, 0.8f, Path.Direction.CW); addCircle(16f, 12f, 0.8f, Path.Direction.CW)
                      }
                  }
              }
          }

          class IconView(ctx: Context, var ic: Ic, var tint: Int = Color.WHITE, var sw: Float = 1.8f, var frac: Float = 0.58f) : View(ctx) {
              override fun onDraw(c: Canvas) {
                  val s = min(width, height) * frac
                  Icons.draw(c, ic, width / 2f, height / 2f, s, tint, sw)
              }
          }

          /** Round colour swatch (mode 0) or pen-size dot (mode 1). */
          class DotView(ctx: Context, var mode: Int, var color: Int, var value: Float = 4f, var ring: Int = Color.WHITE) : View(ctx) {
              private val p = Paint(Paint.ANTI_ALIAS_FLAG)
              override fun onDraw(c: Canvas) {
                  val cx = width / 2f
                  val cy = height / 2f
                  val r = min(width, height) / 2f
                  if (mode == 0) {
                      p.style = Paint.Style.FILL; p.color = color
                      c.drawCircle(cx, cy, r * 0.46f, p)
                      p.style = Paint.Style.STROKE; p.strokeWidth = context.dp(1.6f); p.color = ring
                      c.drawCircle(cx, cy, r * 0.58f, p)
                  } else {
                      p.style = Paint.Style.STROKE; p.strokeWidth = context.dp(1.6f); p.color = withAlpha(color, 150)
                      c.drawCircle(cx, cy, r * 0.58f, p)
                      p.style = Paint.Style.FILL; p.color = color
                      val dr = (context.dp(value) / 2f).coerceIn(context.dp(1.5f), r * 0.5f)
                      c.drawCircle(cx, cy, dr, p)
                  }
              }
          }
          EOF
      - name: File app/src/main/java/com/example/screenpen/Prefs.kt
        run: |
          mkdir -p ScreenPen && cd ScreenPen
          mkdir -p app/src/main/java/com/example/screenpen
          cat > app/src/main/java/com/example/screenpen/Prefs.kt <<'EOF'
          package com.example.screenpen

          import android.content.Context
          import android.content.SharedPreferences

          object K {
              const val PEN_COLOR = "penColor"
              const val PEN_W = "penW"
              const val HL_W = "hlW"
              const val ER_TYPE = "erType"
              const val ER_W = "erW"
              const val ER_AUTO = "erAuto"
              const val STRAIGHT = "straight"
              const val PALM = "palm"
              const val FAVS = "favs"
              const val START_ORIENT = "startOrient"
              const val LAST_ORIENT = "lastOrient"
              const val TB_ITEMS = "tbItems"
              const val TB_SIZE = "tbSize"
              const val TB_ALPHA = "tbAlpha"
              const val TB_COLOR = "tbColor"
              const val TB_X = "tbX"
              const val TB_Y = "tbY"
              const val TM_MODE = "tmMode"
              const val TM_SEC = "tmSec"
              const val TM_PRESETS = "tmPresets"
              const val TM_FMT = "tmFmt"
              const val TM_TEXT = "tmText"
              const val TM_BG = "tmBg"
              const val TM_WARN = "tmWarn"
              const val TM_OVER = "tmOver"
              const val TM_SIZE = "tmSize"
              const val TM_ALPHA = "tmAlpha"
              const val TM_ALERT = "tmAlert"
              const val TM_WARN_AT = "tmWarnAt"
              const val TM_OVERTIME = "tmOvertime"
              const val TM_LOG = "tmLog"
              const val TM_X = "tmX"
              const val TM_Y = "tmY"
              const val TM_ON = "tmOn"
              const val AUTOSAVE = "autosave"
          }

          class Item(val id: String, val label: String, val ic: Ic, val desc: String)

          class Prefs private constructor(c: Context) {
              val sp: SharedPreferences = c.applicationContext.getSharedPreferences("screenpen", Context.MODE_PRIVATE)

              companion object {
                  @Volatile private var inst: Prefs? = null
                  fun get(c: Context): Prefs = inst ?: synchronized(this) { inst ?: Prefs(c).also { inst = it } }

                  val DEF: Map<String, Any> = mapOf(
                      K.PEN_COLOR to 0xFFE5333A.toInt(), K.PEN_W to 4, K.HL_W to 22,
                      K.ER_TYPE to "area", K.ER_W to 28, K.ER_AUTO to true,
                      K.STRAIGHT to true, K.PALM to "off",
                      K.FAVS to "ffe5333a,ff2f6bff,ff1a9e4b,fff5c400,ff111111,ffffffff",
                      K.START_ORIENT to "h", K.LAST_ORIENT to "h",
                      K.TB_ITEMS to "", K.TB_SIZE to 40, K.TB_ALPHA to 94, K.TB_COLOR to 0xFF1E2430.toInt(),
                      K.TB_X to 24, K.TB_Y to 220,
                      K.TM_MODE to "down", K.TM_SEC to 90, K.TM_PRESETS to "30,60,90,120", K.TM_FMT to "ms",
                      K.TM_TEXT to 0xFFFFFFFF.toInt(), K.TM_BG to 0xFF1E2430.toInt(),
                      K.TM_WARN to 0xFFFFB020.toInt(), K.TM_OVER to 0xFFFF4D4F.toInt(),
                      K.TM_SIZE to 15, K.TM_ALPHA to 92, K.TM_ALERT to "vib", K.TM_WARN_AT to 10,
                      K.TM_OVERTIME to true, K.TM_LOG to true, K.TM_X to 24, K.TM_Y to 120, K.TM_ON to false,
                      K.AUTOSAVE to true
                  )

                  val ITEMS: List<Item> = listOf(
                      Item("redo", "Redo", Ic.REDO, "Bring back what you undid"),
                      Item("color", "Colour", Ic.PEN, "Quick colour and thickness panel"),
                      Item("size", "Pen size", Ic.PEN, "Quick thickness slider"),
                      Item("hl", "Highlighter", Ic.HL, "Translucent marker"),
                      Item("shapes", "Shapes", Ic.SHAPES, "Line, rectangle, oval, arrow"),
                      Item("select", "Select", Ic.SELECT, "Circle ink to move, resize, rotate, lock"),
                      Item("laser", "Laser pointer", Ic.LASER, "Fading pointer, leaves no ink"),
                      Item("eye", "Show / hide ink", Ic.EYE, "Hide everything without clearing"),
                      Item("orient", "Rotate toolbar", Ic.ORIENT, "Switch horizontal and vertical"),
                      Item("pages", "Pages", Ic.PAGES, "Several pages of ink"),
                      Item("timer", "Timer", Ic.TIMER, "Floating question timer"),
                      Item("save", "Save as image", Ic.SAVE, "Transparent PNG of this page"),
                      Item("clear", "Clear page", Ic.TRASH, "Remove all ink on this page"),
                      Item("close", "Close pen", Ic.CLOSE, "Stop ScreenPen")
                  )
              }

              fun int(k: String): Int = sp.getInt(k, DEF[k] as Int)
              fun bool(k: String): Boolean = sp.getBoolean(k, DEF[k] as Boolean)
              fun str(k: String): String = sp.getString(k, DEF[k] as String) ?: (DEF[k] as String)

              fun set(k: String, v: Any) {
                  val e = sp.edit()
                  when (v) {
                      is Int -> e.putInt(k, v)
                      is Boolean -> e.putBoolean(k, v)
                      is String -> e.putString(k, v)
                  }
                  e.apply()
              }

              fun enabledItems(): List<Item> =
                  str(K.TB_ITEMS).split(",").filter { it.isNotBlank() }.mapNotNull { id -> ITEMS.firstOrNull { it.id == id } }

              fun setEnabledItems(ids: List<String>) = set(K.TB_ITEMS, ids.joinToString(","))

              fun favs(): MutableList<Int> =
                  str(K.FAVS).split(",").mapNotNull { runCatching { java.lang.Long.parseLong(it, 16).toInt() }.getOrNull() }.toMutableList()

              fun setFavs(l: List<Int>) = set(K.FAVS, l.joinToString(",") { Integer.toHexString(it) })

              fun presets(): List<Int> = str(K.TM_PRESETS).split(",").mapNotNull { it.trim().toIntOrNull() }.filter { it > 0 }
          }
