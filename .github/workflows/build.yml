          package com.example.screenpen

          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.Typeface
          import android.media.RingtoneManager
          import android.os.Handler
          import android.os.Looper
          import android.os.SystemClock
          import android.os.VibrationEffect
          import android.os.Vibrator
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.view.WindowManager
          import android.widget.FrameLayout
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast

          class TimerOverlay(private val svc: OverlayService) {

              private val p = Prefs.get(svc)
              private val wm = svc.wm
              private val h = Handler(Looper.getMainLooper())

              private var root: LinearLayout? = null
              private var tv: TextView? = null
              private var nextBtn: IconView? = null
              private var lp: WindowManager.LayoutParams? = null

              private var state = 0 // 0 idle, 1 running, 2 paused
              private var acc = 0L
              private var startAt = 0L
              private var q = 1
              private var alerted = false

              private val tick = object : Runnable {
                  override fun run() {
                      render()
                      if (state == 1) h.postDelayed(this, 100)
                  }
              }

              val visible: Boolean get() = root != null

              fun toggle() { if (visible) hide() else show() }

              fun show() {
                  if (root != null) return
                  val c = svc
                  val r = LinearLayout(c).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                  }
                  val t = TextView(c).apply {
                      typeface = Typeface.DEFAULT_BOLD
                      fontFeatureSettings = "tnum"
                      gravity = Gravity.CENTER
                      includeFontPadding = false
                  }
                  val nb = IconView(c, Ic.NEXT, Color.WHITE, 2f, 0.62f).apply {
                      setOnClickListener { next() }
                  }
                  r.addView(t, LinearLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT))
                  r.addView(nb, LinearLayout.LayoutParams(c.dpi(30), c.dpi(30)))
                  root = r; tv = t; nextBtn = nb

                  val params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT, WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = c.dpi(p.int(K.TM_X)); y = c.dpi(p.int(K.TM_Y))
                  }
                  lp = params
                  wm.addView(r, params)
                  svc.attachDrag(r, params, r, { tap() }, { openPanel() }) {
                      p.set(K.TM_X, (params.x / c.resources.displayMetrics.density).toInt())
                      p.set(K.TM_Y, (params.y / c.resources.displayMetrics.density).toInt())
                  }
                  p.set(K.TM_ON, true)
                  applyStyle()
                  if (state == 1) h.post(tick)
              }

              fun hide() {
                  h.removeCallbacks(tick)
                  root?.let { runCatching { wm.removeView(it) } }
                  root = null; tv = null; nextBtn = null; lp = null
                  p.set(K.TM_ON, false)
                  // timer keeps its state but a hidden timer should not keep running
                  if (state == 1) { acc = elapsed(); state = 2 }
              }

              fun destroy() {
                  h.removeCallbacks(tick)
                  root?.let { runCatching { wm.removeView(it) } }
                  root = null
              }

              fun applyStyle() {
                  val r = root ?: return
                  val t = tv ?: return
                  val c = svc
                  r.background = roundBg(withAlpha(p.int(K.TM_BG), p.int(K.TM_ALPHA) * 255 / 100), c.dp(16f))
                  val logOn = p.bool(K.TM_LOG)
                  nextBtn?.visibility = if (logOn) View.VISIBLE else View.GONE
                  r.setPadding(c.dpi(10), c.dpi(4), if (logOn) c.dpi(2) else c.dpi(10), c.dpi(4))
                  val size = p.int(K.TM_SIZE).toFloat()
                  t.textSize = size
                  val sample = when (p.str(K.TM_FMT)) { "hms" -> "00:00:00"; "mst" -> "00:00.0"; "s" -> "000"; else -> "00:00" }
                  val pp = android.graphics.Paint(t.paint)
                  pp.textSize = t.textSize
                  t.minWidth = pp.measureText(sample).toInt() + 2
                  render()
              }

              private fun elapsed(): Long = if (state == 1) acc + (SystemClock.elapsedRealtime() - startAt) else acc

              private fun target(): Long = p.int(K.TM_SEC) * 1000L

              private fun isDown() = p.str(K.TM_MODE) == "down"

              private fun render() {
                  val t = tv ?: return
                  val f = p.str(K.TM_FMT)
                  val el = elapsed()
                  var col = p.int(K.TM_TEXT)
                  val text: String
                  if (isDown()) {
                      val tg = target()
                      val rem = tg - el
                      if (rem > 0) {
                          val g = if (f == "mst") 100L else 1000L
                          text = fmtTime(((rem + g - 1) / g) * g, f)
                          if (rem <= p.int(K.TM_WARN_AT) * 1000L) col = p.int(K.TM_WARN)
                      } else {
                          if (state == 1 && !alerted) { alerted = true; alert() }
                          col = p.int(K.TM_OVER)
                          if (p.bool(K.TM_OVERTIME)) {
                              text = "+" + fmtTime(el - tg, f)
                          } else {
                              text = fmtTime(0, f)
                              if (state == 1) { acc = tg; state = 2 }
                          }
                      }
                  } else {
                      text = fmtTime(el, f)
                  }
                  t.text = text
                  t.setTextColor(col)
              }

              private fun alert() {
                  val mode = p.str(K.TM_ALERT)
                  if (mode == "vib" || mode == "both") {
                      runCatching {
                          val v = svc.getSystemService(android.content.Context.VIBRATOR_SERVICE) as Vibrator
                          v.vibrate(VibrationEffect.createWaveform(longArrayOf(0, 220, 120, 220, 120, 420), -1))
                      }
                  }
                  if (mode == "snd" || mode == "both") {
                      runCatching {
                          RingtoneManager.getRingtone(svc, RingtoneManager.getDefaultUri(RingtoneManager.TYPE_NOTIFICATION)).play()
                      }
                  }
              }

              private fun start() {
                  state = 1; startAt = SystemClock.elapsedRealtime()
                  h.removeCallbacks(tick); h.post(tick)
              }

              private fun pause() { acc = elapsed(); state = 2; render() }

              private fun tap() {
                  when (state) {
                      0 -> { acc = 0; alerted = false; start() }
                      1 -> pause()
                      else -> {
                          if (isDown() && !p.bool(K.TM_OVERTIME) && acc >= target()) { acc = 0; alerted = false }
                          start()
                      }
                  }
                  refreshPanelIfAny()
              }

              fun reset(newSession: Boolean) {
                  h.removeCallbacks(tick)
                  state = 0; acc = 0; alerted = false
                  if (newSession) q = 1
                  render()
              }

              fun next() {
                  val el = elapsed()
                  if (state != 0 && el > 0) {
                      Store.addLog(svc, q, el, if (isDown()) target() else 0L)
                      Toast.makeText(svc, "Question $q  ·  ${fmtTime(el, "ms")} saved", Toast.LENGTH_SHORT).show()
                      q++
                  }
                  acc = 0; alerted = false
                  start()
              }

              // ------------------------------------------------------------------ panel
              private var refresh: (() -> Unit)? = null

              private fun refreshPanelIfAny() { refresh?.invoke() }

              private fun openPanel() {
                  val r = root ?: return
                  val c = svc.tc
                  val holder = FrameLayout(c)
                  holder.minimumWidth = c.dpi(270)

                  fun build(): View {
                      val col = PUi.vcol(c)
                      col.addView(PUi.title(c, "MODE"))
                      col.addView(PUi.seg(c, listOf("down" to "Countdown", "up" to "Stopwatch"), p.str(K.TM_MODE)) {
                          p.set(K.TM_MODE, it); reset(false); refresh?.invoke()
                      })
                      if (isDown()) {
                          col.addView(PUi.title(c, "TIME PER QUESTION"))
                          val sec = p.int(K.TM_SEC)
                          val row = PUi.hrow(c)
                          row.gravity = Gravity.CENTER
                          fun stepper(value: Int, label: String, step: Int, onNew: (Int) -> Unit) {
                              row.addView(PUi.iconBtn(c, Ic.MINUS) { onNew(value - step) })
                              val tvv = PUi.text(c, String.format("%02d", value), 20f).apply {
                                  gravity = Gravity.CENTER; typeface = Typeface.DEFAULT_BOLD
                              }
                              row.addView(tvv, PUi.lpW(c, 40, ViewGroup.LayoutParams.WRAP_CONTENT))
                              row.addView(PUi.iconBtn(c, Ic.PLUS) { onNew(value + step) })
                              row.addView(PUi.text(c, label, 11f, 0xFF8A94A8.toInt()), PUi.lpW(c, ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT, 0f, 4))
                          }
                          val m = sec / 60
                          val s = sec % 60
                          stepper(m, "min", 1) { nv -> p.set(K.TM_SEC, (nv.coerceIn(0, 180) * 60 + s).coerceAtLeast(5)); refresh?.invoke() }
                          row.addView(View(c), PUi.lpW(c, 8, 1))
                          stepper(s, "sec", 5) { nv -> p.set(K.TM_SEC, (m * 60 + nv.coerceIn(0, 55)).coerceAtLeast(5)); refresh?.invoke() }
                          col.addView(row)
                          val chips = PUi.hrow(c)
                          for (ps in p.presets().take(5)) {
                              chips.addView(PUi.pill(c, fmtTime(ps * 1000L, "ms"), ps == sec) {
                                  p.set(K.TM_SEC, ps); reset(false); refresh?.invoke()
                              }, PUi.lpW(c, ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT, 0f, 2))
                          }
                          col.addView(PUi.hrow(c).apply { setPadding(0, c.dpi(8), 0, 0); addView(chips) })
                      }
                      col.addView(PUi.title(c, "CONTROLS"))
                      val b = PUi.hrow(c)
                      val running = state == 1
                      b.addView(PUi.pill(c, if (running) "Pause" else "Start", true) { tap(); refresh?.invoke() }, PUi.lpW(c, 0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f, 2))
                      b.addView(PUi.pill(c, "Reset") { reset(false); refresh?.invoke() }, PUi.lpW(c, 0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f, 2))
                      col.addView(b)
                      if (p.bool(K.TM_LOG)) {
                          val b2 = PUi.hrow(c)
                          b2.addView(PUi.pill(c, "Next question  ›") { next(); refresh?.invoke() }, PUi.lpW(c, 0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f, 2))
                          b2.addView(PUi.pill(c, "New session") { reset(true); refresh?.invoke() }, PUi.lpW(c, 0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f, 2))
                          col.addView(b2)
                          col.addView(PUi.text(c, "Next question: question $q", 11f, 0xFF8A94A8.toInt()).apply { setPadding(0, c.dpi(6), 0, 0) })
                      }
                      return col
                  }
                  refresh = { holder.removeAllViews(); holder.addView(build()) }
                  holder.addView(build())
                  svc.showPanel(r, holder) { refresh = null }
              }
          }
          EOF
