      - name: File app/src/main/java/com/example/screenpen/MainActivity.kt
        run: |
          mkdir -p ScreenPen && cd ScreenPen
          mkdir -p app/src/main/java/com/example/screenpen
          cat > app/src/main/java/com/example/screenpen/MainActivity.kt <<'EOF'
          package com.example.screenpen

          import android.Manifest
          import android.app.Activity
          import android.app.AlertDialog
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.content.res.ColorStateList
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.Path
          import android.graphics.Typeface
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.text.InputType
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.view.inputmethod.EditorInfo
          import android.widget.EditText
          import android.widget.FrameLayout
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.SeekBar
          import android.widget.Switch
          import android.widget.TextView
          import java.text.DateFormat
          import java.util.Date

          class MainActivity : Activity() {

              private class Screen(val title: String, val build: (LinearLayout) -> Unit)

              private lateinit var p: Prefs
              private lateinit var host: FrameLayout
              private var scroll: ScrollView? = null
              private val stack = ArrayList<Screen>()
              private val refreshers = ArrayList<() -> Unit>()

              private val MATCH = ViewGroup.LayoutParams.MATCH_PARENT
              private val WRAP = ViewGroup.LayoutParams.WRAP_CONTENT

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  p = Prefs.get(this)
                  C.apply(p.str(K.THEME) == "dark")
                  host = FrameLayout(this)
                  applyWindowColors()
                  setContentView(host)
                  stack.add(Screen("") { buildHome(it) })
                  render()
              }

              private fun applyWindowColors() {
                  val dark = p.str(K.THEME) == "dark"
                  window.statusBarColor = C.BG
                  window.navigationBarColor = C.BG
                  host.setBackgroundColor(C.BG)
                  @Suppress("DEPRECATION")
                  window.decorView.systemUiVisibility = if (dark) 0 else
                      View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR or (if (Build.VERSION.SDK_INT >= 26) View.SYSTEM_UI_FLAG_LIGHT_NAVIGATION_BAR else 0)
              }

              private fun dialog(): AlertDialog.Builder = AlertDialog.Builder(
                  this,
                  if (p.str(K.THEME) == "dark") android.R.style.Theme_Material_Dialog_Alert else android.R.style.Theme_Material_Light_Dialog_Alert
              )

              override fun onResume() {
                  super.onResume()
                  if (stack.size == 1) {
                      render()
                      host.postDelayed({ if (stack.size == 1) render() }, 400)
                  }
              }

              @Deprecated("Deprecated in Java")
              override fun onBackPressed() {
                  if (stack.size > 1) { stack.removeAt(stack.size - 1); render() } else super.onBackPressed()
              }

              private fun push(title: String, build: (LinearLayout) -> Unit) { stack.add(Screen(title, build)); render() }

              private fun render(keepScroll: Boolean = false) {
                  val y = if (keepScroll) scroll?.scrollY ?: 0 else 0
                  host.removeAllViews()
                  val s = stack.last()
                  val col = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setBackgroundColor(C.BG) }
                  if (stack.size > 1) {
                      val top = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER_VERTICAL }
                      val back = IconView(this, Ic.BACK, C.INK, 2.2f, 0.5f).apply {
                          setOnClickListener { onBackPressed() }
                      }
                      top.addView(back, LinearLayout.LayoutParams(dpi(52), dpi(52)))
                      top.addView(tv(s.title, 20f, C.INK, true))
                      col.addView(top)
                  }
                  val sv = ScrollView(this).apply { isVerticalScrollBarEnabled = false }
                  val body = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dpi(16), dpi(if (stack.size > 1) 4 else 28), dpi(16), dpi(28))
                  }
                  sv.addView(body)
                  col.addView(sv, LinearLayout.LayoutParams(MATCH, 0, 1f))
                  scroll = sv
                  refreshers.clear()
                  s.build(body)
                  host.addView(col, FrameLayout.LayoutParams(MATCH, MATCH))
                  if (keepScroll) sv.post { sv.scrollTo(0, y) }
              }

              // ------------------------------------------------------------------ tiny UI kit
              private fun tv(text: String, sizeSp: Float, color: Int, bold: Boolean = false) = TextView(this).apply {
                  this.text = text
                  textSize = sizeSp
                  setTextColor(color)
                  if (bold) typeface = Typeface.DEFAULT_BOLD
              }

              private fun lp(w: Int = MATCH, h: Int = WRAP, weight: Float = 0f, top: Int = 0, bottom: Int = 0) =
                  LinearLayout.LayoutParams(w, h, weight).apply { topMargin = dpi(top); bottomMargin = dpi(bottom) }

              private fun section(body: LinearLayout, text: String) {
                  body.addView(tv(text.uppercase(), 11.5f, C.SUB, true).apply { letterSpacing = 0.08f }, lp(top = 14, bottom = 8).apply { leftMargin = dpi(4) })
              }

              private fun note(body: LinearLayout, text: String) {
                  body.addView(tv(text, 13f, C.SUB).apply { setLineSpacing(0f, 1.15f) }, lp(bottom = 10).apply { leftMargin = dpi(4); rightMargin = dpi(4) })
              }

              private fun card(body: LinearLayout): LinearLayout {
                  val c = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      background = roundBg(C.CARD, dp(16f))
                      elevation = dp(1f)
                  }
                  body.addView(c, lp(bottom = 12))
                  return c
              }

              private fun divider(card: LinearLayout) {
                  card.addView(View(this).apply { setBackgroundColor(C.LINE) }, lp(h = 1).apply { leftMargin = dpi(16) })
              }

              private fun pad(v: LinearLayout) = v.setPadding(dpi(16), dpi(13), dpi(16), dpi(13))

              private fun set(key: String, v: Any) {
                  p.set(key, v)
                  refreshers.forEach { it() }
              }

              private fun textCol(title: String, sub: String?): LinearLayout = LinearLayout(this).apply {
                  orientation = LinearLayout.VERTICAL
                  addView(tv(title, 15.5f, C.INK))
                  if (!sub.isNullOrEmpty()) addView(tv(sub, 12.5f, C.SUB).apply { setPadding(0, dpi(2), 0, 0) })
              }

              private fun navRow(card: LinearLayout, ic: Ic, title: String, sub: String, click: () -> Unit) {
                  if (card.childCount > 0) divider(card)
                  val row = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER_VERTICAL; pad(this) }
                  val badge = IconView(this, ic, C.ACCENT, 1.9f, 0.58f).apply { background = roundBg(withAlpha(C.ACCENT, 28), dp(12f)) }
                  row.addView(badge, LinearLayout.LayoutParams(dpi(42), dpi(42)).apply { rightMargin = dpi(14) })
                  row.addView(textCol(title, sub), lp(0, WRAP, 1f))
                  row.addView(IconView(this, Ic.CHEV_R, C.SUB, 2f, 0.5f), LinearLayout.LayoutParams(dpi(28), dpi(28)))
                  row.setOnClickListener { click() }
                  card.addView(row)
              }

              private fun switchRow(card: LinearLayout, title: String, sub: String?, key: String) {
                  if (card.childCount > 0) divider(card)
                  val row = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER_VERTICAL; pad(this) }
                  row.addView(textCol(title, sub), lp(0, WRAP, 1f))
                  row.addView(makeSwitch(p.bool(key)) { set(key, it) })
                  row.setOnClickListener { (row.getChildAt(1) as Switch).toggle() }
                  card.addView(row)
              }

              private fun makeSwitch(on: Boolean, onChange: (Boolean) -> Unit) = Switch(this).apply {
                  isChecked = on
                  thumbTintList = ColorStateList.valueOf(Color.WHITE)
                  trackTintList = ColorStateList(
                      arrayOf(intArrayOf(android.R.attr.state_checked), intArrayOf()),
                      intArrayOf(C.ACCENT, 0xFFC5CCD8.toInt())
                  )
                  setOnCheckedChangeListener { _, v -> onChange(v) }
              }

              private fun sliderRow(card: LinearLayout, title: String, key: String, min: Int, max: Int, unit: String, step: Int = 1, buzz: Boolean = false) {
                  if (card.childCount > 0) divider(card)
                  val col = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; pad(this) }
                  val head = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                  val value = tv("${p.int(key)} $unit", 14f, C.ACCENT, true)
                  head.addView(tv(title, 15.5f, C.INK), lp(0, WRAP, 1f))
                  head.addView(value)
                  col.addView(head)
                  val sb = SeekBar(this).apply {
                      this.max = (max - min) / step
                      progress = ((p.int(key) - min) / step).coerceIn(0, (max - min) / step)
                      progressTintList = ColorStateList.valueOf(C.ACCENT)
                      thumbTintList = ColorStateList.valueOf(C.ACCENT)
                      setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                          override fun onProgressChanged(s: SeekBar?, pr: Int, fromUser: Boolean) {
                              if (!fromUser) return
                              val v = min + pr * step
                              value.text = "$v $unit"
                              set(key, v)
                              if (buzz) Haptics.buzz(this@MainActivity, v)
                          }
                          override fun onStartTrackingTouch(s: SeekBar?) {}
                          override fun onStopTrackingTouch(s: SeekBar?) {}
                      })
                  }
                  col.addView(sb, lp(top = 4))
                  card.addView(col)
              }

              private fun segRow(card: LinearLayout, title: String, key: String, options: List<Pair<String, String>>, afterChange: (() -> Unit)? = null) {
                  if (card.childCount > 0) divider(card)
                  val col = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; pad(this) }
                  col.addView(tv(title, 15.5f, C.INK), lp(bottom = 10))
                  val box = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      background = roundBg(C.CHIP, dp(12f))
                      setPadding(dpi(3), dpi(3), dpi(3), dpi(3))
                  }
                  val views = ArrayList<TextView>()
                  fun paint() {
                      val cur = p.str(key)
                      for ((i, v) in views.withIndex()) {
                          val on = options[i].first == cur
                          v.background = if (on) roundBg(C.ACCENT, dp(10f)) else null
                          v.setTextColor(if (on) Color.WHITE else C.INK)
                      }
                  }
                  for ((k, label) in options) {
                      val v = tv(label, 13.5f, C.INK).apply {
                          gravity = Gravity.CENTER
                          setPadding(dpi(6), dpi(10), dpi(6), dpi(10))
                          setOnClickListener { set(key, k); paint(); afterChange?.invoke() }
                      }
                      views.add(v)
                      box.addView(v, lp(0, WRAP, 1f))
                  }
                  paint()
                  col.addView(box)
                  card.addView(col)
              }

              private fun colorRow(card: LinearLayout, title: String, key: String) {
                  if (card.childCount > 0) divider(card)
                  val holder = FrameLayout(this)
                  lateinit var rebuild: () -> Unit
                  fun build(): View {
                      val col = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; pad(this) }
                      val head = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER_VERTICAL }
                      head.addView(tv(title, 15.5f, C.INK), lp(0, WRAP, 1f))
                      val cur = p.int(key)
                      head.addView(tv(String.format("#%06X", cur and 0xFFFFFF), 12.5f, C.SUB).apply { setPadding(0, 0, dpi(8), 0) })
                      head.addView(View(this).apply { background = roundBg(cur, dp(11f), C.LINE, dp(1f)) }, LinearLayout.LayoutParams(dpi(22), dpi(22)))
                      col.addView(head, lp(bottom = 10))
                      val pal = C.PALETTE
                      for (r in 0..1) {
                          val row = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                          for (i in 0 until 8) {
                              val c = pal[r * 8 + i]
                              val sel = c == cur
                              row.addView(View(this).apply {
                                  background = roundBg(c, dp(16f), if (sel) C.ACCENT else C.LINE, dp(if (sel) 2.5f else 1f))
                                  setOnClickListener { set(key, c); rebuild() }
                              }, LinearLayout.LayoutParams(0, dpi(32), 1f).apply { setMargins(dpi(3), dpi(3), dpi(3), dpi(3)) })
                          }
                          col.addView(row)
                      }
                      val hexRow = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER_VERTICAL }
                      val et = EditText(this).apply {
                          hint = "Custom colour, e.g. FF8800"
                          setTextColor(C.INK)
                          setHintTextColor(C.SUB)
                          textSize = 14f
                          inputType = InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_FLAG_CAP_CHARACTERS
                          imeOptions = EditorInfo.IME_ACTION_DONE
                          setSingleLine()
                          filters = arrayOf(android.text.InputFilter.LengthFilter(7))
                      }
                      fun apply() {
                          val t = et.text.toString().trim().removePrefix("#")
                          if (t.length == 6) runCatching { set(key, Color.parseColor("#$t")); rebuild() }
                      }
                      et.setOnEditorActionListener { _, _, _ -> apply(); true }
                      hexRow.addView(et, lp(0, WRAP, 1f))
                      hexRow.addView(tv("Apply", 14f, C.ACCENT, true).apply {
                          setPadding(dpi(14), dpi(10), dpi(6), dpi(10))
                          setOnClickListener { apply() }
                      })
                      col.addView(hexRow, lp(top = 6))
                      return col
                  }
                  rebuild = { holder.removeAllViews(); holder.addView(build()) }
                  holder.addView(build())
                  card.addView(holder)
              }

              private fun bigButton(text: String, color: Int, click: () -> Unit) = TextView(this).apply {
                  this.text = text
                  textSize = 17f
                  typeface = Typeface.DEFAULT_BOLD
                  setTextColor(Color.WHITE)
                  gravity = Gravity.CENTER
                  background = roundBg(color, dp(16f))
                  setPadding(dpi(16), dpi(17), dpi(16), dpi(17))
                  setOnClickListener { click() }
              }

              // ------------------------------------------------------------------ home
              private fun buildHome(body: LinearLayout) {
                  val head = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER_VERTICAL }
                  head.addView(LogoView(this), LinearLayout.LayoutParams(dpi(46), dpi(46)).apply { rightMargin = dpi(12) })
                  head.addView(tv("Penta", 30f, C.INK, true), lp(0, WRAP, 1f))
                  val dark = p.str(K.THEME) == "dark"
                  head.addView(
                      IconView(this, if (dark) Ic.SUN else Ic.MOON, C.INK, 2f, 0.56f).apply {
                          background = roundBg(C.CHIP, dp(15f))
                          setOnClickListener {
                              p.set(K.THEME, if (dark) "light" else "dark")
                              C.apply(!dark)
                              applyWindowColors()
                              render()
                          }
                      },
                      LinearLayout.LayoutParams(dpi(46), dpi(46))
                  )
                  body.addView(head)
                  body.addView(tv("Write and draw on top of any app.", 15f, C.SUB), lp(top = 12, bottom = 22))

                  val c = card(body)
                  c.setPadding(dpi(16), dpi(16), dpi(16), dpi(16))
                  if (!Settings.canDrawOverlays(this)) {
                      c.addView(tv("One-time setup", 17f, C.INK, true))
                      c.addView(tv("Penta needs permission to display over other apps.", 14f, C.SUB), lp(top = 4, bottom = 14))
                      c.addView(bigButton("Allow permission", C.ACCENT) {
                          startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                      })
                  } else {
                      val running = OverlayService.running
                      c.addView(tv(if (running) "Pen is on" else "Ready", 17f, C.INK, true))
                      c.addView(tv(if (running) "Switch to another app and start writing." else "Tap start, then open any app.", 14f, C.SUB), lp(top = 4, bottom = 14))
                      val sw = ModeSwitch(this, running, "Slide to stop", "Slide to start", Ic.PEN, Ic.PLAY, 0xFF9AA5B8.toInt()) { on ->
                          if (on) startPen() else {
                              stopService(Intent(this, OverlayService::class.java))
                              host.postDelayed({ if (stack.size == 1) render() }, 500)
                          }
                      }
                      c.addView(sw, LinearLayout.LayoutParams(MATCH, dpi(64)))
                  }

                  section(body, "Customise")
                  val s = card(body)
                  navRow(s, Ic.TOOLBAR, "Toolbar", "Buttons, layout, size, touch feedback") { push("Toolbar") { buildToolbar(it) } }
                  navRow(s, Ic.PEN, "Pen and highlighter", "Colours, thickness, straight lines") { push("Pen and highlighter") { buildPen(it) } }
                  navRow(s, Ic.ERASER, "Eraser", "Type, size, auto switch") { push("Eraser") { buildEraser(it) } }
                  navRow(s, Ic.TIMER, "Timer", "Format, colours, alerts, question log") { push("Timer") { buildTimer(it) } }
                  navRow(s, Ic.PAGES, "Pages and saving", "Page bar look, auto-save, palm protection") { push("Pages and saving") { buildSaving(it) } }

              }

              private fun startPen() {
                  if (Build.VERSION.SDK_INT >= 33 &&
                      checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED
                  ) requestPermissions(arrayOf(Manifest.permission.POST_NOTIFICATIONS), 1)
                  startForegroundService(Intent(this, OverlayService::class.java))
                  moveTaskToBack(true)
              }

              // ------------------------------------------------------------------ toolbar
              private fun buildToolbar(body: LinearLayout) {
                  section(body, "Layout")
                  val l = card(body)
                  segRow(l, "Starts as", K.START_ORIENT, listOf("h" to "Horizontal", "v" to "Vertical", "last" to "Last used"))
                  segRow(l, "Opens", K.TB_DIR, listOf("down" to "Downward", "up" to "Upward"))
                  sliderRow(l, "Button size", K.TB_SIZE, 32, 56, "dp")
                  sliderRow(l, "Transparency", K.TB_ALPHA, 30, 100, "%")
                  colorRow(l, "Toolbar colour", K.TB_COLOR)
                  note(body, "Downward keeps the three-line handle at the top (left when horizontal) and opens the buttons after it. Upward keeps the handle at the bottom (right when horizontal) and opens the buttons before it.")

                  section(body, "Touch feedback")
                  val fb = card(body)
                  switchRow(fb, "Press shadow", "A glow appears behind a button when you touch it, so you can see it was pressed.", K.TB_FX)
                  switchRow(fb, "Vibrate on touch", null, K.TB_VIB)
                  sliderRow(fb, "Vibration strength", K.TB_VIB_STR, 1, 5, "of 5", 1, true)

                  section(body, "Buttons")
                  note(body, "Pen, Eraser and Undo are always shown. Switch on anything else you want, and use the arrows to change the order.")
                  val b = card(body)
                  val enabled = p.enabledItems().map { it.id }.toMutableList()
                  val ordered = enabled.mapNotNull { id -> Prefs.ITEMS.firstOrNull { it.id == id } } + Prefs.ITEMS.filter { it.id !in enabled }
                  for (item in ordered) {
                      if (b.childCount > 0) divider(b)
                      val isOn = item.id in enabled
                      val row = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER_VERTICAL; pad(this) }
                      row.addView(
                          IconView(this, item.ic, if (isOn) C.ACCENT else C.SUB, 1.9f, 0.58f).apply {
                              background = roundBg(if (isOn) withAlpha(C.ACCENT, 28) else C.CHIP, dp(12f))
                          },
                          LinearLayout.LayoutParams(dpi(40), dpi(40)).apply { rightMargin = dpi(12) }
                      )
                      row.addView(textCol(item.label, item.desc), lp(0, WRAP, 1f))
                      if (isOn) {
                          val idx = enabled.indexOf(item.id)
                          fun arrow(ic: Ic, dir: Int) {
                              val ok = idx + dir in enabled.indices
                              row.addView(IconView(this, ic, if (ok) C.INK else C.LINE, 2f, 0.5f).apply {
                                  if (ok) setOnClickListener {
                                      val l2 = enabled.toMutableList()
                                      l2.removeAt(idx); l2.add(idx + dir, item.id)
                                      p.setEnabledItems(l2); render(true)
                                  }
                              }, LinearLayout.LayoutParams(dpi(32), dpi(36)))
                          }
                          arrow(Ic.CHEV_U, -1); arrow(Ic.CHEV_D, 1)
                      }
                      row.addView(makeSwitch(isOn) { on ->
                          val l2 = p.enabledItems().map { it.id }.toMutableList()
                          if (on) l2.add(item.id) else l2.remove(item.id)
                          p.setEnabledItems(l2); render(true)
                      })
                      b.addView(row)
                  }
              }

              // ------------------------------------------------------------------ pen
              private class StrokePreview(val a: MainActivity) : View(a) {
                  private val paint = Paint(Paint.ANTI_ALIAS_FLAG).apply { style = Paint.Style.STROKE; strokeCap = Paint.Cap.ROUND }
                  override fun onDraw(c: Canvas) {
                      val pr = Prefs.get(a)
                      val w = width.toFloat()
                      val h = height.toFloat()
                      val path = Path()
                      path.moveTo(w * 0.08f, h * 0.65f)
                      path.cubicTo(w * 0.28f, h * 0.05f, w * 0.42f, h * 1.05f, w * 0.6f, h * 0.45f)
                      path.cubicTo(w * 0.7f, h * 0.15f, w * 0.82f, h * 0.35f, w * 0.92f, h * 0.3f)
                      paint.color = pr.int(K.PEN_COLOR)
                      paint.strokeWidth = a.dp(pr.int(K.PEN_W).toFloat())
                      c.drawPath(path, paint)
                  }
              }

              private fun buildPen(body: LinearLayout) {
                  val pv = StrokePreview(this)
                  val pc = card(body)
                  pc.addView(pv, lp(h = dpi(84)))
                  refreshers.add { pv.invalidate() }

                  section(body, "Pen")
                  val c = card(body)
                  colorRow(c, "Default colour", K.PEN_COLOR)
                  sliderRow(c, "Thickness", K.PEN_W, 1, 30, "dp")
                  sliderRow(c, "Highlighter thickness", K.HL_W, 8, 60, "dp")
                  switchRow(c, "Hold to straighten", "Pause at the end of a stroke and it snaps into a straight line.", K.STRAIGHT)

                  section(body, "Favourite colours")
                  note(body, "Tap a favourite to replace it with the current pen colour.")
                  val f = card(body)
                  val holder = FrameLayout(this)
                  lateinit var rebuild: () -> Unit
                  fun build(): View {
                      val row = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL; pad(this) }
                      val favs = p.favs()
                      for ((i, col) in favs.withIndex()) {
                          row.addView(View(this).apply {
                              background = roundBg(col, dp(18f), if (col == p.int(K.PEN_COLOR)) C.ACCENT else C.LINE, dp(if (col == p.int(K.PEN_COLOR)) 2.5f else 1f))
                              setOnClickListener { val l = p.favs(); l[i] = p.int(K.PEN_COLOR); p.setFavs(l); rebuild() }
                          }, LinearLayout.LayoutParams(0, dpi(36), 1f).apply { setMargins(dpi(4), 0, dpi(4), 0) })
                      }
                      return row
                  }
                  rebuild = { holder.removeAllViews(); holder.addView(build()) }
                  holder.addView(build())
                  refreshers.add { rebuild() }
                  f.addView(holder)
              }

              // ------------------------------------------------------------------ eraser
              private fun buildEraser(body: LinearLayout) {
                  val c = card(body)
                  segRow(c, "Eraser type", K.ER_TYPE, listOf("area" to "Area", "stroke" to "Whole stroke"))
                  sliderRow(c, "Eraser size", K.ER_W, 8, 80, "dp")
                  switchRow(c, "Switch back to pen", "After you erase once and lift your finger, the pen is selected again.", K.ER_AUTO)
                  note(body, "Area erases only what your finger touches. Whole stroke removes a complete line the moment you touch it. You can also long-press the eraser button in the toolbar for these options.")
              }

              // ------------------------------------------------------------------ timer
              private fun previewPill(text: String, colorKey: String): TextView = tv(text, p.int(K.TM_SIZE).toFloat(), p.int(colorKey), true).apply {
                  fontFeatureSettings = "tnum"
                  gravity = Gravity.CENTER
                  setPadding(dpi(12), dpi(5), dpi(12), dpi(5))
                  background = PillDrawable(withAlpha(p.int(K.TM_BG), p.int(K.TM_ALPHA) * 255 / 100), p.int(K.TM_ROUND))
              }

              private fun buildTimer(body: LinearLayout) {
                  val pc = card(body)
                  pc.setBackgroundColor(Color.TRANSPARENT)
                  val pr = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER; setPadding(0, dpi(6), 0, dpi(6)) }
                  pc.addView(pr)
                  fun fill() {
                      pr.removeAllViews()
                      val f = p.str(K.TM_FMT)
                      for ((txt, key) in listOf(fmtTime(90000, f) to K.TM_TEXT, fmtTime(8000, f) to K.TM_WARN, ("+" + fmtTime(12000, f)) to K.TM_OVER)) {
                          pr.addView(previewPill(txt, key), LinearLayout.LayoutParams(WRAP, WRAP).apply { setMargins(dpi(5), 0, dpi(5), 0) })
                      }
                  }
                  fill()
                  refreshers.add { fill() }
                  note(body, "Preview: normal, warning and overtime. Corner roundness: 0% is a sharp square, 100% is a fully round pill.")

                  section(body, "Behaviour")
                  val c = card(body)
                  segRow(c, "Mode", K.TM_MODE, listOf("down" to "Countdown", "up" to "Stopwatch"))
                  // time per question
                  divider(c)
                  val tcol = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; pad(this) }
                  val tval = tv("", 14f, C.ACCENT, true)
                  val thead = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                  thead.addView(tv("Time per question", 15.5f, C.INK), lp(0, WRAP, 1f))
                  thead.addView(tval)
                  tcol.addView(thead)
                  fun upd() { val s = p.int(K.TM_SEC); tval.text = "${s / 60} min ${s % 60} s" }
                  upd()
                  fun timeSlider(max: Int, step: Int, get: () -> Int, put: (Int) -> Unit) {
                      tcol.addView(SeekBar(this).apply {
                          this.max = max / step
                          progress = get() / step
                          progressTintList = ColorStateList.valueOf(C.ACCENT)
                          thumbTintList = ColorStateList.valueOf(C.ACCENT)
                          setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                              override fun onProgressChanged(s: SeekBar?, pr2: Int, fromUser: Boolean) {
                                  if (fromUser) { put(pr2 * step); upd() }
                              }
                              override fun onStartTrackingTouch(s: SeekBar?) {}
                              override fun onStopTrackingTouch(s: SeekBar?) {}
                          })
                      }, lp(top = 4))
                  }
                  tcol.addView(tv("Minutes", 12f, C.SUB), lp(top = 4))
                  timeSlider(120, 1, { p.int(K.TM_SEC) / 60 }) { m -> set(K.TM_SEC, (m * 60 + p.int(K.TM_SEC) % 60).coerceAtLeast(5)) }
                  tcol.addView(tv("Seconds", 12f, C.SUB), lp(top = 2))
                  timeSlider(55, 5, { p.int(K.TM_SEC) % 60 }) { s -> set(K.TM_SEC, (p.int(K.TM_SEC) / 60 * 60 + s).coerceAtLeast(5)) }
                  c.addView(tcol)

                  // presets
                  divider(c)
                  val prow = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; pad(this) }
                  prow.addView(tv("Quick times", 15.5f, C.INK))
                  prow.addView(tv("Tap one to remove it. These appear in the timer panel.", 12.5f, C.SUB), lp(top = 2, bottom = 8))
                  val chips = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                  prow.addView(chips)
                  fun chipsFill() {
                      chips.removeAllViews()
                      for (sec in p.presets()) {
                          chips.addView(tv(fmtTime(sec * 1000L, "ms"), 13.5f, C.INK, true).apply {
                              background = roundBg(C.CHIP, dp(10f))
                              setPadding(dpi(11), dpi(8), dpi(11), dpi(8))
                              setOnClickListener { p.set(K.TM_PRESETS, p.presets().filter { it != sec }.joinToString(",")); chipsFill() }
                          }, LinearLayout.LayoutParams(WRAP, WRAP).apply { rightMargin = dpi(6) })
                      }
                      if (p.presets().size < 6) {
                          chips.addView(tv("+ Add current", 13.5f, Color.WHITE, true).apply {
                              background = roundBg(C.ACCENT, dp(10f))
                              setPadding(dpi(11), dpi(8), dpi(11), dpi(8))
                              setOnClickListener {
                                  val l = p.presets().toMutableList()
                                  if (p.int(K.TM_SEC) !in l) l.add(p.int(K.TM_SEC))
                                  p.set(K.TM_PRESETS, l.sorted().joinToString(",")); chipsFill()
                              }
                          })
                      }
                  }
                  chipsFill()
                  c.addView(prow)

                  switchRow(c, "Keep counting after zero", "Shows +00:12 in red so you can see how far you went over.", K.TM_OVERTIME)
                  sliderRow(c, "Warning starts", K.TM_WARN_AT, 0, 60, "s before end", 5)
                  segRow(c, "Alert at zero", K.TM_ALERT, listOf("none" to "None", "vib" to "Vibrate", "snd" to "Sound", "both" to "Both"))
                  switchRow(c, "Question tag", "Adds a Next button that saves the time taken for each question.", K.TM_LOG)
                  switchRow(c, "Show reset button", "A small reset icon beside the time, so you do not need to open the panel.", K.TM_SHOW_RESET)
                  navRow(c, Ic.PAGES, "View question log", "Times you saved with Next") { push("Question log") { buildLog(it) } }

                  section(body, "Touch feedback")
                  val fb = card(body)
                  switchRow(fb, "Press shadow", "A glow appears when you start, pause or reset the timer.", K.TM_FX)
                  switchRow(fb, "Vibrate on touch", null, K.TM_VIB)
                  sliderRow(fb, "Vibration strength", K.TM_VIB_STR, 1, 5, "of 5", 1, true)

                  section(body, "Look")
                  val l = card(body)
                  segRow(l, "Time format", K.TM_FMT, listOf("ms" to "mm:ss", "hms" to "hh:mm:ss", "mst" to "mm:ss.t", "s" to "Seconds"))
                  sliderRow(l, "Bubble size", K.TM_SIZE, 10, 40, "")
                  sliderRow(l, "Corner roundness", K.TM_ROUND, 0, 100, "%")
                  sliderRow(l, "Transparency", K.TM_ALPHA, 30, 100, "%")
                  colorRow(l, "Text colour", K.TM_TEXT)
                  colorRow(l, "Background colour", K.TM_BG)
                  colorRow(l, "Warning colour", K.TM_WARN)
                  colorRow(l, "Overtime colour", K.TM_OVER)
              }

              private fun buildLog(body: LinearLayout) {
                  val items = Store.readLog(this).reversed()
                  if (items.isEmpty()) {
                      body.addView(tv("Nothing saved yet.", 16f, C.INK, true), lp(top = 20))
                      note(body, "Turn on Question log, start the timer and tap the Next button after each question.")
                      return
                  }
                  val avg = items.map { it.ms }.average().toLong()
                  val s = card(body)
                  s.setPadding(dpi(16), dpi(14), dpi(16), dpi(14))
                  s.addView(tv("${items.size} questions", 17f, C.INK, true))
                  s.addView(tv("Average ${fmtTime(avg, "ms")}", 14f, C.SUB), lp(top = 2))
                  val c = card(body)
                  val df = DateFormat.getDateTimeInstance(DateFormat.SHORT, DateFormat.SHORT)
                  for (e in items) {
                      if (c.childCount > 0) divider(c)
                      val row = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER_VERTICAL; pad(this) }
                      row.addView(tv("Q${e.q}", 15f, C.INK, true), LinearLayout.LayoutParams(dpi(48), WRAP))
                      row.addView(tv(df.format(Date(e.ts)), 12.5f, C.SUB), lp(0, WRAP, 1f))
                      val over = e.target > 0 && e.ms > e.target
                      val label = fmtTime(e.ms, "ms") + if (e.target > 0) "  /  " + fmtTime(e.target, "ms") else ""
                      row.addView(tv(label, 14f, if (over) C.DANGER else C.INK, true))
                      c.addView(row)
                  }
                  body.addView(bigButton("Clear log", C.DANGER) {
                      dialog().setMessage("Delete all saved question times?")
                          .setPositiveButton("Delete") { _, _ -> Store.clearLog(this); render() }
                          .setNegativeButton("Cancel", null).show()
                  }, lp(top = 4))
              }

              // ------------------------------------------------------------------ saving
              private fun buildSaving(body: LinearLayout) {
                  // ---- preview of the floating page bar on a neutral backdrop
                  val pc = card(body)
                  pc.setBackgroundColor(Color.TRANSPARENT)
                  pc.background = roundBg(0xFF8C97AB.toInt(), dp(16f))
                  val stage = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; gravity = Gravity.CENTER; setPadding(0, dpi(18), 0, dpi(18)) }
                  pc.addView(stage)
                  fun fillPreview() {
                      stage.removeAllViews()
                      val outline = if (p.bool(K.PG_OUTLINE)) 0xDD000000.toInt() else 0
                      val bar = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; gravity = Gravity.CENTER_HORIZONTAL; setPadding(dpi(8), dpi(6), dpi(8), dpi(6)) }
                      val a = p.int(K.PG_BG_ALPHA)
                      if (a > 0) bar.background = roundBg(withAlpha(p.int(K.PG_BG), a * 255 / 100), dp(14f))
                      val row = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                      for ((ic, tint) in listOf(Ic.BACK to Color.WHITE, Ic.PLUS to Color.WHITE, Ic.TRASH to 0xFFFF7A7A.toInt(), Ic.CHEV_R to Color.WHITE)) {
                          row.addView(IconView(this, ic, tint, 2.2f, 0.62f).apply { this.outline = outline }, LinearLayout.LayoutParams(dpi(36), dpi(36)))
                      }
                      bar.addView(row)
                      bar.addView(tv("2 / 5", 12.5f, Color.WHITE, true).apply {
                          gravity = Gravity.CENTER
                          if (outline != 0) setShadowLayer(dp(3.5f), 0f, 0f, Color.BLACK)
                      })
                      stage.addView(bar)
                  }
                  fillPreview()
                  refreshers.add { fillPreview() }
                  note(body, "Preview of the floating page bar. You can also long-press the paper icon in the toolbar to change these.")

                  section(body, "Page bar")
                  val pb = card(body)
                  switchRow(pb, "Black outline", "A thin black edge around each icon so it stays visible with no background.", K.PG_OUTLINE)
                  sliderRow(pb, "Background darkness", K.PG_BG_ALPHA, 0, 100, "%")
                  colorRow(pb, "Background colour", K.PG_BG)

                  section(body, "Saving")
                  val c = card(body)
                  switchRow(c, "Auto-save pages", "Your writing is restored the next time you start the pen.", K.AUTOSAVE)
                  segRow(c, "Palm protection", K.PALM, listOf("off" to "Off", "palm" to "Ignore palm", "stylus" to "Stylus only"))
                  note(body, "Ignore palm skips large touches and extra fingers while you write. Stylus only draws with a pen and ignores fingers.")
                  body.addView(bigButton("Delete saved pages", C.DANGER) {
                      dialog().setMessage("Delete the saved pages? Stop and start the pen again to begin with a blank page.")
                          .setPositiveButton("Delete") { _, _ -> Store.deleteSaved(this) }
                          .setNegativeButton("Cancel", null).show()
                  }, lp(top = 4))
              }
          }
