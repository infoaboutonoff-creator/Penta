              private var holdY = 0f
              private var straight = false
              private var before: List<Stroke> = emptyList()
              private var shapePts: FloatArray? = null
              private var sx0 = 0f
              private var sy0 = 0f
              private var erX = 0f
              private var erY = 0f
              private var erActive = false

              // selection
              private val sel = ArrayList<Stroke>()          // the selected pieces (drawn with the move/scale/rotate matrix)
              private val selOutside = ArrayList<Stroke>()   // leftover parts of strokes that were only partly circled
              private val selSet: MutableSet<Stroke> = Collections.newSetFromMap(IdentityHashMap()) // originals hidden while selected
              private val pieceMap = IdentityHashMap<Stroke, Pair<List<Stroke>, List<Stroke>>>()    // original -> (outside, inside)
              private val selBounds = RectF()
              private var sCx = 0f
              private var sCy = 0f
              private var sAng = 0f
              private var sSc = 1f
              private val selM = Matrix()
              private val selInv = Matrix()
              private var corners = FloatArray(8)
              private var selMode = 0 // 1 lasso, 2 move, 3 rotate, 4 scale, 5 lock tap, 6 blocked, 7 ignore
              private val lasso = FL()
              private var downX = 0f
              private var downY = 0f
              private var cx0 = 0f
              private var cy0 = 0f
              private var startAng = 0f
              private var ang0 = 0f
              private var dist0 = 1f
              private var sc0 = 1f
              private var movedFar = false
              private val boxPath = Path()

              private val laser = ArrayList<LP>()
              private var laserDown = false

              private val holdRun = Runnable {
                  if (gesture == 1 && !straight && cur.n >= 4) {
                      straight = true
                      val x0 = cur.a[0]
                      val y0 = cur.a[1]
                      cur.clear(); cur.add2(x0, y0); cur.add2(lastX, lastY)
                      rebuildStraight()
                      invalidate()
                  }
              }
              private val longRun = Runnable {
                  if (gesture == 4) {
                      clearSel(); selMode = 7; lasso.clear(); invalidate()
                  }
              }

              val hasUndo: Boolean get() = page.undo.isNotEmpty()
              val hasRedo: Boolean get() = page.redo.isNotEmpty()

              // ------------------------------------------------------------------ drawing
              override fun onDraw(c: Canvas) {
                  if (hidden) return
                  for (s in page.strokes) if (!selSet.contains(s)) drawStroke(c, s)
                  for (s in selOutside) drawStroke(c, s)
                  if (sel.isNotEmpty()) {
                      c.save(); c.concat(selM)
                      for (s in sel) drawStroke(c, s)
                      c.restore()
                      drawSelBox(c)
                  }
                  when (gesture) {
                      1 -> {
                          sp.style = Paint.Style.STROKE
                          val hl = tool == Tool.HL
                          sp.strokeWidth = if (hl) hlW else penW
                          sp.strokeCap = if (hl) Paint.Cap.SQUARE else Paint.Cap.ROUND
                          sp.color = penColor
                          if (hl) sp.alpha = 105
                          c.drawPath(curPath, sp)
                      }
                      2 -> shapePts?.let {
                          sp.strokeWidth = penW; sp.strokeCap = Paint.Cap.ROUND; sp.color = penColor
                          val p = Path()
                          p.moveTo(it[0], it[1])
                          var i = 2
                          while (i < it.size) { p.lineTo(it[i], it[i + 1]); i += 2 }
                          c.drawPath(p, sp)
                      }
                      4 -> if (selMode == 1 && lasso.n >= 4) {
                          boxPath.reset()
                          boxPath.moveTo(lasso.a[0], lasso.a[1])
                          var i = 2
                          while (i < lasso.n) { boxPath.lineTo(lasso.a[i], lasso.a[i + 1]); i += 2 }
                          sp.pathEffect = dash; sp.strokeWidth = 1.6f * d; sp.color = C.ACCENT; sp.strokeCap = Paint.Cap.ROUND
                          c.drawPath(boxPath, sp)
                          sp.pathEffect = null
                      }
                  }
                  if (erActive) {
                      val r = if (erArea) erW / 2f else max(erW / 2f, 6f * d)
                      fp.style = Paint.Style.FILL; fp.color = 0x33FFFFFF
                      c.drawCircle(erX, erY, r, fp)
                      fp.style = Paint.Style.STROKE; fp.strokeWidth = 1.5f * d; fp.color = 0xCC222222.toInt()
                      c.drawCircle(erX, erY, r, fp)
                  }
                  drawLaser(c)
              }

              private fun drawStroke(c: Canvas, s: Stroke) {
                  sp.style = Paint.Style.STROKE
                  sp.strokeWidth = s.width
                  sp.strokeCap = if (s.kind == 1) Paint.Cap.SQUARE else Paint.Cap.ROUND
                  sp.color = s.color
                  if (s.kind == 1) sp.alpha = 105
                  sp.pathEffect = null
                  c.drawPath(s.path, sp)
              }

              private fun drawLaser(c: Canvas) {
                  if (laser.isEmpty()) return
                  val now = SystemClock.uptimeMillis()
                  laser.removeAll { now - it.t > 650 }
                  for (i in 1 until laser.size) {
                      val a = laser[i - 1]
                      val b = laser[i]
                      val k = 1f - (now - b.t) / 650f
                      sp.style = Paint.Style.STROKE; sp.pathEffect = null; sp.strokeCap = Paint.Cap.ROUND
                      sp.color = 0xFFFF2D2D.toInt(); sp.alpha = (200 * k).toInt().coerceIn(0, 255)
                      sp.strokeWidth = (3f + 5f * k) * d
                      c.drawLine(a.x, a.y, b.x, b.y, sp)
                  }
                  laser.lastOrNull()?.let {
                      val k = (1f - (now - it.t) / 650f).coerceIn(0f, 1f)
                      fp.style = Paint.Style.FILL
                      fp.color = 0xFFFF2D2D.toInt(); fp.alpha = (70 * k).toInt()
                      c.drawCircle(it.x, it.y, 14f * d, fp)
                      fp.color = 0xFFFF2D2D.toInt(); fp.alpha = (255 * k).toInt()
                      c.drawCircle(it.x, it.y, 6f * d, fp)
                      fp.color = Color.WHITE; fp.alpha = (255 * k).toInt()
                      c.drawCircle(it.x, it.y, 2.4f * d, fp)
                  }
                  if (laser.isNotEmpty()) postInvalidateOnAnimation()
              }

              private fun drawSelBox(c: Canvas) {
                  val q = corners
                  boxPath.reset()
                  boxPath.moveTo(q[0], q[1]); boxPath.lineTo(q[2], q[3]); boxPath.lineTo(q[4], q[5]); boxPath.lineTo(q[6], q[7]); boxPath.close()
                  sp.style = Paint.Style.STROKE; sp.strokeWidth = 1.6f * d; sp.color = C.ACCENT; sp.pathEffect = dash
                  c.drawPath(boxPath, sp)
                  sp.pathEffect = null
                  val locked = selLocked()
                  handle(c, q[0], q[1], if (locked) Ic.LOCK else Ic.UNLOCK, false)
                  handle(c, q[2], q[3], Ic.ORIENT, locked)
                  handle(c, q[4], q[5], Ic.RESIZE, locked)
                  handle(c, q[6], q[7], Ic.TRASH, locked, true)
              }

              private fun handle(c: Canvas, x: Float, y: Float, ic: Ic, dim: Boolean, danger: Boolean = false) {
                  fp.style = Paint.Style.FILL
                  fp.color = if (dim) 0xFF9AA7BD.toInt() else if (danger) C.DANGER else C.ACCENT
                  c.drawCircle(x, y, 15f * d, fp)
                  Icons.draw(c, ic, x, y, 18f * d, Color.WHITE, 2f)
              }

              // ------------------------------------------------------------------ touch
              override fun onTouchEvent(e: MotionEvent): Boolean {
                  if (hidden) return false
                  val a = e.actionMasked
                  if (a == MotionEvent.ACTION_DOWN) {
                      ignoring = false
                      if (palm == "stylus" && e.getToolType(0) == MotionEvent.TOOL_TYPE_FINGER) ignoring = true
                      if (palm == "palm" && e.getTouchMajor(0) > 110f * d) ignoring = true
                  }
                  if (ignoring) {
                      if (a == MotionEvent.ACTION_UP || a == MotionEvent.ACTION_CANCEL) ignoring = false
                      return true
                  }
                  if (palm != "off" && e.pointerCount > 1) return true
                  when (tool) {
                      Tool.PEN, Tool.HL -> penTouch(a, e)
                      Tool.SHAPE -> shapeTouch(a, e)
                      Tool.ERASER -> eraseTouch(a, e)
                      Tool.SELECT -> selectTouch(a, e)
                      Tool.LASER -> laserTouch(a, e)
                  }
                  return true
              }

              private fun cancelGesture() {
                  removeCallbacks(holdRun); removeCallbacks(longRun)
                  gesture = 0; erActive = false; shapePts = null; selMode = 0; laserDown = false
              }

              private fun commit(prev: List<Stroke>) {
                  val p = page
                  p.undo.add(Snap(prev, ArrayList(p.strokes)))
                  if (p.undo.size > 80) p.undo.removeAt(0)
                  p.redo.clear()
                  onCommit?.invoke()
                  invalidate()
              }

              // ---- pen / highlighter
              private fun penTouch(a: Int, e: MotionEvent) {
                  when (a) {
                      MotionEvent.ACTION_DOWN -> {
                          cur.clear(); cur.add2(e.x, e.y)
                          curPath = Path(); curPath.moveTo(e.x, e.y)
                          lastX = e.x; lastY = e.y; holdX = e.x; holdY = e.y
                          straight = false
                          before = ArrayList(page.strokes)
                          gesture = 1
                          invalidate()
                      }
                      MotionEvent.ACTION_MOVE -> if (gesture == 1) {
                          for (i in 0 until e.historySize) addPenPoint(e.getHistoricalX(i), e.getHistoricalY(i))
                          addPenPoint(e.x, e.y)
                          invalidate()
                      }
                      MotionEvent.ACTION_UP -> finishPen(true)
                      MotionEvent.ACTION_CANCEL -> finishPen(false)
                  }
              }

              private fun addPenPoint(x: Float, y: Float) {
                  if (straight) {
                      cur.a[2] = x; cur.a[3] = y
                      lastX = x; lastY = y
                      rebuildStraight()
                      return
                  }
                  if (hypot(x - lastX, y - lastY) < 1.2f * d) return
                  cur.add2(x, y)
                  curPath.quadTo(lastX, lastY, (x + lastX) / 2f, (y + lastY) / 2f)
                  lastX = x; lastY = y
                  if (hypot(x - holdX, y - holdY) > 6f * d) {
                      holdX = x; holdY = y
                      removeCallbacks(holdRun)
                      if (straighten) postDelayed(holdRun, 550)
                  }
              }

              private fun rebuildStraight() {
                  curPath = Path()
                  curPath.moveTo(cur.a[0], cur.a[1])
                  curPath.lineTo(cur.a[2], cur.a[3])
              }

              private fun finishPen(ok: Boolean) {
                  removeCallbacks(holdRun)
                  if (gesture != 1) return
                  gesture = 0
                  if (ok && cur.n >= 2) {
                      val hl = tool == Tool.HL
                      page.strokes.add(Stroke(if (hl) 1 else 0, penColor, if (hl) hlW else penW, cur.toArray()))
                      commit(before)
                  }
                  curPath = Path()
                  invalidate()
              }

              // ---- shapes
              private fun makeShape(kind: Int, x0: Float, y0: Float, x1: Float, y1: Float): FloatArray = when (kind) {
                  1 -> floatArrayOf(x0, y0, x1, y0, x1, y1, x0, y1, x0, y0)
                  2 -> {
                      val cx = (x0 + x1) / 2f
                      val cy = (y0 + y1) / 2f
                      val rx = Math.abs(x1 - x0) / 2f
                      val ry = Math.abs(y1 - y0) / 2f
                      val n = 48
                      FloatArray((n + 1) * 2).also {
                          for (i in 0..n) {
                              val t = (2.0 * Math.PI * i / n)
                              it[2 * i] = cx + rx * cos(t).toFloat()
                              it[2 * i + 1] = cy + ry * sin(t).toFloat()
                          }
                      }
                  }
                  3 -> {
                      val ang = atan2(y1 - y0, x1 - x0)
                      val hl = min(26f * d, hypot(x1 - x0, y1 - y0) * 0.4f)
                      floatArrayOf(
                          x0, y0, x1, y1,
                          x1 - hl * cos(ang - 0.45f), y1 - hl * sin(ang - 0.45f), x1, y1,
                          x1 - hl * cos(ang + 0.45f), y1 - hl * sin(ang + 0.45f)
                      )
                  }
                  else -> floatArrayOf(x0, y0, x1, y1)
              }

              private fun shapeTouch(a: Int, e: MotionEvent) {
                  when (a) {
                      MotionEvent.ACTION_DOWN -> {
                          sx0 = e.x; sy0 = e.y
                          before = ArrayList(page.strokes)
                          shapePts = makeShape(shape, sx0, sy0, e.x, e.y)
                          gesture = 2
                          invalidate()
                      }
                      MotionEvent.ACTION_MOVE -> if (gesture == 2) {
                          shapePts = makeShape(shape, sx0, sy0, e.x, e.y); invalidate()
                      }
                      MotionEvent.ACTION_UP -> {
                          if (gesture == 2 && hypot(e.x - sx0, e.y - sy0) > 6f * d) {
                              page.strokes.add(Stroke(2, penColor, penW, makeShape(shape, sx0, sy0, e.x, e.y)))
                              commit(before)
                          }
                          gesture = 0; shapePts = null; invalidate()
                      }
                      MotionEvent.ACTION_CANCEL -> { gesture = 0; shapePts = null; invalidate() }
                  }
              }

              // ---- erasers
              private fun eraseTouch(a: Int, e: MotionEvent) {
                  when (a) {
                      MotionEvent.ACTION_DOWN -> {
                          before = ArrayList(page.strokes)
                          gesture = 3; erActive = true
                          erX = e.x; erY = e.y
                          eraseAt(erX, erY)
                          invalidate()
                      }
                      MotionEvent.ACTION_MOVE -> if (gesture == 3) {
                          for (i in 0 until e.historySize) eraseSeg(e.getHistoricalX(i), e.getHistoricalY(i))
                          eraseSeg(e.x, e.y)
                          invalidate()
                      }
                      MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> if (gesture == 3) {
                          gesture = 0; erActive = false
                          val now = page.strokes
                          val changed = now.size != before.size || now.indices.any { now[it] !== before[it] }
                          if (changed) commit(before)
                          invalidate()
                          onEraseDone?.invoke()
                      }
                  }
              }

              private fun eraseSeg(x: Float, y: Float) {
                  val r = erW / 2f
                  val step = max(r * 0.5f, 3f * d)
                  val dist = hypot(x - erX, y - erY)
                  val n = Math.ceil((dist / step).toDouble()).toInt().coerceAtLeast(1)
                  val sx = erX
                  val sy = erY
                  for (i in 1..n) eraseAt(sx + (x - sx) * i / n, sy + (y - sy) * i / n)
                  erX = x; erY = y
              }

              private fun eraseAt(x: Float, y: Float) {
                  if (erArea) eraseArea(x, y, erW / 2f) else eraseStroke(x, y, max(erW / 2f, 6f * d))
              }

              private fun nearBounds(b: RectF, x: Float, y: Float, r: Float) =
                  x >= b.left - r && x <= b.right + r && y >= b.top - r && y <= b.bottom + r

              private fun eraseStroke(x: Float, y: Float, r: Float) {
                  var changed = false
                  val out = ArrayList<Stroke>(page.strokes.size)
                  for (s in page.strokes) {
                      val rr = r + s.width / 2f
                      if (!s.locked && nearBounds(s.bounds, x, y, rr) && nearPoly(s.pts, x, y, rr)) changed = true else out.add(s)
                  }
                  if (changed) page.strokes = out
              }

              private fun nearPoly(p: FloatArray, x: Float, y: Float, r: Float): Boolean {
                  val n = p.size / 2
                  if (n == 1) return hypot(p[0] - x, p[1] - y) <= r
                  for (i in 0 until n - 1) {
                      if (segDist(x, y, p[2 * i], p[2 * i + 1], p[2 * i + 2], p[2 * i + 3]) <= r) return true
                  }
                  return false
              }

              private fun segDist(px: Float, py: Float, ax: Float, ay: Float, bx: Float, by: Float): Float {
                  val dx = bx - ax
                  val dy = by - ay
                  val l2 = dx * dx + dy * dy
                  var t = if (l2 == 0f) 0f else ((px - ax) * dx + (py - ay) * dy) / l2
                  t = t.coerceIn(0f, 1f)
                  return hypot(px - (ax + t * dx), py - (ay + t * dy))
              }

              private fun eraseArea(x: Float, y: Float, r: Float) {
                  var changed = false
                  val out = ArrayList<Stroke>(page.strokes.size + 4)
                  for (s in page.strokes) {
                      val rr = r + s.width / 2f
                      if (s.locked || !nearBounds(s.bounds, x, y, rr)) { out.add(s); continue }
                      val pieces = cut(s, x, y, rr)
                      if (pieces == null) out.add(s) else { out.addAll(pieces); changed = true }
                  }
                  if (changed) page.strokes = out
              }

              private fun cut(s: Stroke, x: Float, y: Float, rad: Float): List<Stroke>? {
                  val p = densify(s.pts, max(rad * 0.45f, 3f * d))
                  val pieces = ArrayList<Stroke>()
                  val piece = FL()
                  var removed = false
                  fun flush() {
                      if (piece.n >= 4) pieces.add(Stroke(s.kind, s.color, s.width, piece.toArray(), false))
                      piece.clear()
                  }
                  for (i in 0 until p.size / 2) {
                      if (hypot(p[2 * i] - x, p[2 * i + 1] - y) < rad) { removed = true; flush() } else piece.add2(p[2 * i], p[2 * i + 1])
                  }
                  flush()
                  return if (removed) pieces else null
              }

              private fun densify(p: FloatArray, gap: Float): FloatArray {
                  val out = FL()
                  val n = p.size / 2
                  out.add2(p[0], p[1])
                  for (i in 1 until n) {
                      val ax = p[2 * i - 2]; val ay = p[2 * i - 1]
                      val bx = p[2 * i]; val by = p[2 * i + 1]
                      val seg = hypot(bx - ax, by - ay)
                      val k = Math.ceil((seg / gap).toDouble()).toInt()
                      for (j in 1..k) out.add2(ax + (bx - ax) * j / k, ay + (by - ay) * j / k)
                  }
                  return out.toArray()
              }

              // ---- selection
              private fun selLocked() = sel.isNotEmpty() && sel.all { it.locked }

              fun clearSel() {
                  sel.clear(); selOutside.clear(); selSet.clear(); pieceMap.clear(); selMode = 0
                  invalidate()
              }

              /** Selects whole strokes that already live in the page. */
              private fun setSelectionWhole(strokes: List<Stroke>) {
                  sel.clear(); selOutside.clear(); selSet.clear(); pieceMap.clear()
                  for (s in strokes) {
                      selSet.add(s); pieceMap[s] = Pair(emptyList(), listOf(s)); sel.add(s)
                  }
                  if (sel.isNotEmpty()) resetParams()
              }

              private fun updateM() {
                  selM.reset()
                  selM.postTranslate(-selBounds.centerX(), -selBounds.centerY())
                  selM.postScale(sSc, sSc)
                  selM.postRotate(Math.toDegrees(sAng.toDouble()).toFloat())
                  selM.postTranslate(sCx, sCy)
                  selM.invert(selInv)
                  val pad = 10f * d / sSc
                  val l = selBounds.left - pad
                  val t = selBounds.top - pad
                  val r = selBounds.right + pad
                  val b = selBounds.bottom + pad
                  corners = floatArrayOf(l, t, r, t, r, b, l, b)
                  selM.mapPoints(corners)
              }

              private fun resetParams() {
                  var l = Float.MAX_VALUE; var t = Float.MAX_VALUE; var r = -Float.MAX_VALUE; var b = -Float.MAX_VALUE
                  for (s in sel) {
                      val bb = s.bounds
                      l = min(l, bb.left); t = min(t, bb.top); r = max(r, bb.right); b = max(b, bb.bottom)
                  }
                  selBounds.set(l, t, r, b)
                  sCx = selBounds.centerX(); sCy = selBounds.centerY(); sAng = 0f; sSc = 1f
                  updateM()
              }

              private fun hitHandle(x: Float, y: Float): Int {
                  val rad = 26f * d
                  val q = corners
                  if (hypot(x - q[2], y - q[3]) < rad) return 1 // rotate
                  if (hypot(x - q[4], y - q[5]) < rad) return 2 // scale
                  if (hypot(x - q[0], y - q[1]) < rad) return 3 // lock
                  if (hypot(x - q[6], y - q[7]) < rad) return 4 // delete
                  return 0
              }

              private fun insideBox(x: Float, y: Float): Boolean {
                  val pt = floatArrayOf(x, y)
                  selInv.mapPoints(pt)
                  val pad = 10f * d / sSc
                  return pt[0] >= selBounds.left - pad && pt[0] <= selBounds.right + pad &&
                      pt[1] >= selBounds.top - pad && pt[1] <= selBounds.bottom + pad
              }

              private fun selectTouch(a: Int, e: MotionEvent) {
                  val x = e.x
                  val y = e.y
                  when (a) {
                      MotionEvent.ACTION_DOWN -> {
                          gesture = 4; selMode = 0
                          downX = x; downY = y; movedFar = false
                          if (sel.isNotEmpty()) {
                              val locked = selLocked()
                              when (hitHandle(x, y)) {
                                  1 -> if (locked) selMode = 6 else { selMode = 3; startAng = atan2(y - sCy, x - sCx); ang0 = sAng }
                                  2 -> if (locked) selMode = 6 else { selMode = 4; dist0 = max(hypot(x - sCx, y - sCy), 1f); sc0 = sSc }
                                  3 -> selMode = 5
                                  4 -> selMode = if (locked) 6 else 8
                                  else -> if (insideBox(x, y)) { selMode = if (locked) 6 else 2; cx0 = sCx; cy0 = sCy }
                              }
                          }
                          if (selMode == 0) {
                              clearSel(); selMode = 1; lasso.clear(); lasso.add2(x, y)
                          }
                          removeCallbacks(longRun)
                          postDelayed(longRun, 1200)
                          invalidate()
                      }
                      MotionEvent.ACTION_MOVE -> if (gesture == 4) {
                          if (!movedFar && hypot(x - downX, y - downY) > 10f * d) { movedFar = true; removeCallbacks(longRun) }
                          when (selMode) {
                              1 -> lasso.add2(x, y)
                              2 -> { sCx = cx0 + (x - downX); sCy = cy0 + (y - downY); updateM() }
                              3 -> { sAng = ang0 + (atan2(y - sCy, x - sCx) - startAng); updateM() }
                              4 -> { sSc = (sc0 * hypot(x - sCx, y - sCy) / dist0).coerceIn(0.1f, 12f); updateM() }
                          }
                          invalidate()
                      }
                      MotionEvent.ACTION_UP -> {
                          removeCallbacks(longRun)
                          if (gesture == 4) {
                              when (selMode) {
                                  1 -> finishLasso()
                                  2, 3, 4 -> bake()
                                  5 -> if (hitHandle(x, y) == 3 && !movedFar) toggleLock()
                                  8 -> if (hitHandle(x, y) == 4 && !movedFar && !selLocked()) deleteSelection()
                              }
                          }
                          gesture = 0; selMode = 0; invalidate()
                      }
                      MotionEvent.ACTION_CANCEL -> {
                          removeCallbacks(longRun)
                          if (selMode in 2..4) { resetParams() }
                          gesture = 0; selMode = 0; lasso.clear(); invalidate()
                      }
                  }
              }

              private fun inPoly(px: Float, py: Float, poly: FloatArray, n: Int): Boolean {
                  var inside = false
                  var j = n - 1
                  for (i in 0 until n) {
                      val xi = poly[2 * i]; val yi = poly[2 * i + 1]
                      val xj = poly[2 * j]; val yj = poly[2 * j + 1]
                      if ((yi > py) != (yj > py) && px < (xj - xi) * (py - yi) / (yj - yi) + xi) inside = !inside
                      j = i
                  }
                  return inside
              }

              private fun finishLasso() {
                  val n = lasso.n / 2
                  if (n < 3) { lasso.clear(); return }
                  val poly = lasso.toArray()
                  var l = Float.MAX_VALUE; var t = Float.MAX_VALUE; var r = -Float.MAX_VALUE; var b = -Float.MAX_VALUE
                  for (i in 0 until n) {
                      l = min(l, poly[2 * i]); r = max(r, poly[2 * i])
                      t = min(t, poly[2 * i + 1]); b = max(b, poly[2 * i + 1])
                  }
                  val box = RectF(l, t, r, b)
                  for (s in page.strokes) {
                      val bb = s.bounds
                      if (bb.right < box.left || bb.left > box.right || bb.bottom < box.top || bb.top > box.bottom) continue
                      val parts = splitByLasso(s, poly, n) ?: continue
                      selSet.add(s)
                      pieceMap[s] = parts
                      sel.addAll(parts.second)
                      selOutside.addAll(parts.first)
                  }
                  lasso.clear()
                  if (sel.isNotEmpty()) resetParams()
              }

              /**
               * Cuts a stroke along the lasso. Returns (outside pieces, inside pieces),
               * or null when nothing of the stroke is inside the circle.
               */
              private fun splitByLasso(s: Stroke, poly: FloatArray, n: Int): Pair<List<Stroke>, List<Stroke>>? {
                  val pts = if (s.count == 1) s.pts else densify(s.pts, 3f * d)
                  val m = pts.size / 2
                  val inside = BooleanArray(m) { inPoly(pts[2 * it], pts[2 * it + 1], poly, n) }
                  if (inside.none { it }) return null
                  if (inside.all { it }) return Pair(emptyList(), listOf(s))
                  val outP = ArrayList<Stroke>()
                  val inP = ArrayList<Stroke>()
                  var start = 0
                  for (i in 1..m) {
                      if (i == m || inside[i] != inside[start]) {
                          val end = if (i < m) i else i - 1 // share the boundary point so the line stays joined
                          if (end - start + 1 >= 2) {
                              val piece = Stroke(s.kind, s.color, s.width, pts.copyOfRange(2 * start, 2 * end + 2), s.locked)
                              var len = 0f
                              for (k in start until end) len += hypot(pts[2 * k + 2] - pts[2 * k], pts[2 * k + 3] - pts[2 * k + 1])
                              // a tiny sliver that only touches the circle is left alone
                              if (inside[start] && len >= 4f * d) inP.add(piece) else outP.add(piece)
                          }
                          start = i
                      }
                  }
                  if (inP.isEmpty()) return null
                  return Pair(outP, inP)
              }

              private fun bake() {
                  val moved = hypot(sCx - selBounds.centerX(), sCy - selBounds.centerY()) > 0.5f ||
                      Math.abs(sSc - 1f) > 0.001f || Math.abs(sAng) > 0.001f
                  if (!moved) { resetParams(); return }
                  val m = Matrix(selM)
                  val prev = ArrayList(page.strokes)
                  val out = ArrayList<Stroke>(prev.size + 8)
                  val newSel = ArrayList<Stroke>()
                  for (s in prev) {
                      val e = pieceMap[s]
                      if (e == null) out.add(s) else {
                          out.addAll(e.first)
                          for (ins in e.second) { val t = ins.transformed(m); out.add(t); newSel.add(t) }
                      }
                  }
                  page.strokes = out
                  setSelectionWhole(newSel)
                  commit(prev)
              }

              private fun deleteSelection() {
                  if (sel.isEmpty()) return
                  val prev = ArrayList(page.strokes)
                  val out = ArrayList<Stroke>(prev.size)
                  for (s in prev) {
                      val e = pieceMap[s]
                      if (e == null) out.add(s) else out.addAll(e.first)
                  }
                  page.strokes = out
                  clearSel()
                  commit(prev)
              }

              private fun toggleLock() {
                  if (sel.isEmpty()) return
                  val lock = !selLocked()
                  val prev = ArrayList(page.strokes)
                  val out = ArrayList<Stroke>(prev.size + 8)
                  val newSel = ArrayList<Stroke>()
                  for (s in prev) {
                      val e = pieceMap[s]
                      if (e == null) out.add(s) else {
                          out.addAll(e.first)
                          for (ins in e.second) { val t = ins.withLocked(lock); out.add(t); newSel.add(t) }
                      }
                  }
                  page.strokes = out
                  setSelectionWhole(newSel)
                  commit(prev)
              }

              // ---- laser
              private fun laserTouch(a: Int, e: MotionEvent) {
                  val now = SystemClock.uptimeMillis()
                  when (a) {
                      MotionEvent.ACTION_DOWN, MotionEvent.ACTION_MOVE -> {
                          laserDown = true
                          for (i in 0 until e.historySize) laser.add(LP(e.getHistoricalX(i), e.getHistoricalY(i), now))
                          laser.add(LP(e.x, e.y, now))
                          invalidate()
                      }
                      MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> { laserDown = false; invalidate() }
                  }
              }

              // ------------------------------------------------------------------ public actions
              fun undo() {
                  val p = page
                  if (p.undo.isEmpty()) return
                  val s = p.undo.removeAt(p.undo.size - 1)
                  p.redo.add(s)
                  p.strokes = ArrayList(s.before)
                  clearSel(); onCommit?.invoke(); invalidate()
              }

              fun redo() {
                  val p = page
                  if (p.redo.isEmpty()) return
                  val s = p.redo.removeAt(p.redo.size - 1)
                  p.undo.add(s)
                  p.strokes = ArrayList(s.after)
                  clearSel(); onCommit?.invoke(); invalidate()
              }

              fun clearPage() {
                  if (page.strokes.isEmpty()) return
                  val prev = ArrayList(page.strokes)
                  page.strokes = ArrayList()
                  clearSel()
                  commit(prev)
              }

              fun pageChanged() {
                  clearSel(); cancelGesture(); invalidate()
              }

              fun renderBitmap(): Bitmap {
                  val b = Bitmap.createBitmap(max(width, 1), max(height, 1), Bitmap.Config.ARGB_8888)
                  val c = Canvas(b)
                  for (s in page.strokes) drawStroke(c, s)
                  return b
              }
          }
          EOF
