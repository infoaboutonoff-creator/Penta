          package com.example.screenpen

          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.Typeface
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.view.WindowManager
          import android.widget.LinearLayout
          import android.widget.TextView

          /** Small floating page bar: previous, new, delete, next, with the page number below. No background. */
          class PagesOverlay(private val svc: OverlayService) {

              private val p = Prefs.get(svc)
              private val wm = svc.wm
              private var root: LinearLayout? = null
              private var label: TextView? = null
              private var prev: IconView? = null
              private var next: IconView? = null
              private var btns: List<IconView> = emptyList()

              val visible: Boolean get() = root != null

              fun toggle() { if (visible) hide() else show() }

              private fun button(ic: Ic, tint: Int, size: Int, click: () -> Unit): IconView {
                  val v = IconView(svc, ic, tint, 2.2f, 0.62f)
                  v.layoutParams = LinearLayout.LayoutParams(size, size)
                  v.setOnClickListener { click(); refresh() }
                  Fx.attach(v, p.bool(K.TB_FX), p.bool(K.TB_VIB), p.int(K.TB_VIB_STR))
                  return v
              }

              fun show() {
                  if (root != null) return
                  val c = svc
                  val cell = c.dpi(34)
                  val r = LinearLayout(c).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER_HORIZONTAL
                      setPadding(c.dpi(6), c.dpi(4), c.dpi(6), c.dpi(4))
                  }
                  val row = LinearLayout(c).apply { orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER }
                  val pv = button(Ic.BACK, Color.WHITE, cell) { svc.changePage(-1) }
                  val add = button(Ic.PLUS, Color.WHITE, cell) { svc.addPage() }
                  val del = button(Ic.TRASH, 0xFFFF7A7A.toInt(), cell) { svc.deletePage() }
                  val nx = button(Ic.CHEV_R, Color.WHITE, cell) { svc.changePage(1) }
                  row.addView(pv); row.addView(add); row.addView(del); row.addView(nx)
                  val t = TextView(c).apply {
                      textSize = 12.5f
                      typeface = Typeface.DEFAULT_BOLD
                      setTextColor(Color.WHITE)
                      setShadowLayer(c.dp(3.5f), 0f, 0f, 0xFF000000.toInt())
                      gravity = Gravity.CENTER
                      setPadding(0, 0, 0, c.dpi(2))
                  }
                  r.addView(row, LinearLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT))
                  r.addView(t, LinearLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT))
                  root = r; label = t; prev = pv; next = nx
                  btns = listOf(pv, add, del, nx)

                  val params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT, WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = c.dpi(p.int(K.PG_X)); y = c.dpi(p.int(K.PG_Y))
                  }
                  wm.addView(r, params)
                  // drag it by the page number or by the gaps between the icons
                  svc.attachDrag(r, params, r, {}, null) {
                      val d = c.resources.displayMetrics.density
                      p.set(K.PG_X, (params.x / d).toInt())
                      p.set(K.PG_Y, (params.y / d).toInt())
                  }
                  applyStyle()
                  refresh()
              }

              /** Black outline on or off, and an optional coloured background of adjustable darkness. */
              fun applyStyle() {
                  val r = root ?: return
                  val outline = if (p.bool(K.PG_OUTLINE)) 0xDD000000.toInt() else 0
                  for (b in btns) { b.outline = outline; b.invalidate() }
                  label?.setShadowLayer(if (outline != 0) svc.dp(3.5f) else 0f, 0f, 0f, 0xFF000000.toInt())
                  val a = p.int(K.PG_BG_ALPHA)
                  r.background = if (a > 0) roundBg(withAlpha(p.int(K.PG_BG), a * 255 / 100), svc.dp(14f)) else null
              }

              fun refresh() {
                  val i = svc.pageNumber()
                  val n = svc.pageTotal()
                  label?.text = "$i / $n"
                  prev?.alpha = if (i > 1) 1f else 0.35f
                  next?.alpha = if (i < n) 1f else 0.35f
              }

              fun hide() {
                  root?.let { runCatching { wm.removeView(it) } }
                  root = null; label = null; prev = null; next = null; btns = emptyList()
              }

              fun destroy() = hide()
          }
          EOF
