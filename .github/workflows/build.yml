          package com.example.screenpen

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.content.SharedPreferences
          import android.content.pm.ServiceInfo
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.Point
          import android.graphics.drawable.Icon
          import android.os.Build
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.view.ContextThemeWrapper
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.ViewConfiguration
          import android.view.ViewGroup
          import android.view.WindowManager
          import android.widget.FrameLayout
          import android.widget.LinearLayout
          import android.widget.Toast
          import kotlin.math.abs
          import kotlin.math.max

          class OverlayService : Service(), SharedPreferences.OnSharedPreferenceChangeListener {

              companion object {
                  const val ACTION_STOP = "com.example.screenpen.STOP"
                  private const val CHANNEL_ID = "screen_pen"
                  @Volatile var running = false
              }

              lateinit var wm: WindowManager
              lateinit var tc: Context
              private lateinit var p: Prefs
              private lateinit var doc: Doc
              private val handler = Handler(Looper.getMainLooper())

              private var dv: DrawView? = null
              private lateinit var drawParams: WindowManager.LayoutParams
              private var bar: LinearLayout? = null
              private lateinit var barParams: WindowManager.LayoutParams
              private var timer: TimerOverlay? = null
              private var pagesBar: PagesOverlay? = null

              private var interact = true // starts as the arrow; the user picks the pen first
              private var hidden = false
              private var collapsed = false
              private var orient = "h"
              private var lastTool = DrawView.Tool.PEN
              private var undoView: View? = null
              private var animateIn = true
              private var handleOffX = 0
              private var handleOffY = 0
              private var hxPx = 0 // where the three-line handle sits on screen; the bar is always placed around it
              private var hyPx = 0
              private var redoView: View? = null

              private var panelRoot: FrameLayout? = null
              private var panelDismiss: (() -> Unit)? = null

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (intent?.action == ACTION_STOP) {
                      stopSelf()
                      return START_NOT_STICKY
                  }
                  if (!running) {
                      startAsForeground()
                      setup()
                      running = true
                  }
                  return START_NOT_STICKY
              }

              private fun startAsForeground() {
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(NotificationChannel(CHANNEL_ID, "Penta", NotificationManager.IMPORTANCE_LOW))
                  val stop = PendingIntent.getService(
                      this, 0, Intent(this, OverlayService::class.java).setAction(ACTION_STOP), PendingIntent.FLAG_IMMUTABLE
                  )
                  val open = PendingIntent.getActivity(this, 1, Intent(this, MainActivity::class.java), PendingIntent.FLAG_IMMUTABLE)
                  val n = Notification.Builder(this, CHANNEL_ID)
                      .setContentTitle("Penta is on")
                      .setContentText("Tap to open settings")
                      .setSmallIcon(android.R.drawable.ic_menu_edit)
                      .setContentIntent(open)
                      .setOngoing(true)
                      .addAction(
                          Notification.Action.Builder(Icon.createWithResource(this, android.R.drawable.ic_delete), "Stop", stop).build()
                      )
                      .build()
                  if (Build.VERSION.SDK_INT >= 34) startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE)
                  else startForeground(1, n)
              }

              // ------------------------------------------------------------------ setup
              private fun setup() {
                  wm = getSystemService(WINDOW_SERVICE) as WindowManager
                  tc = ContextThemeWrapper(this, android.R.style.Theme_Material)
                  p = Prefs.get(this)
                  doc = if (p.bool(K.AUTOSAVE)) Store.load(this) else Doc()
                  orient = if (p.str(K.START_ORIENT) == "last") p.str(K.LAST_ORIENT) else p.str(K.START_ORIENT)

                  val v = DrawView(this)
                  v.doc = doc
                  v.onCommit = { scheduleSave(); handler.post { refreshUndo() } }
                  v.onEraseDone = { if (p.bool(K.ER_AUTO)) handler.post { setTool(lastTool) } }
                  dv = v
                  applyDraw()
                  drawParams = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.MATCH_PARENT, WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                          WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS or WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE,
                      PixelFormat.TRANSLUCENT
                  )
                  wm.addView(v, drawParams)

                  timer = TimerOverlay(this)
                  pagesBar = PagesOverlay(this)
                  if (p.bool(K.TM_ON)) timer?.show()

                  val b = LinearLayout(this)
                  bar = b
                  barParams = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT, WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = 0; y = 0
                  }
                  hxPx = dpi(p.int(K.TB_X)); hyPx = dpi(p.int(K.TB_Y))
                  rebuildBar()
                  wm.addView(b, barParams)
                  p.sp.registerOnSharedPreferenceChangeListener(this)
              }

              private fun applyDraw() {
                  val v = dv ?: return
                  v.penColor = p.int(K.PEN_COLOR)
                  v.penW = dp(p.int(K.PEN_W).toFloat())
                  v.hlW = dp(p.int(K.HL_W).toFloat())
                  v.erArea = p.str(K.ER_TYPE) == "area"
                  v.erW = dp(p.int(K.ER_W).toFloat())
                  v.straighten = p.bool(K.STRAIGHT)
                  v.palm = p.str(K.PALM)
              }

              override fun onSharedPreferenceChanged(sp: SharedPreferences?, key: String?) {
                  if (dv == null || key == null) return
                  when (key) {
                      K.PEN_COLOR, K.PEN_W -> { applyDraw(); rebuildSoon(0) }
                      K.HL_W, K.ER_TYPE, K.ER_W, K.STRAIGHT, K.PALM -> applyDraw()
                      K.TB_ITEMS, K.TB_SIZE, K.TB_ALPHA, K.TB_COLOR, K.TB_DIR, K.TB_FX, K.TB_VIB, K.TB_VIB_STR -> rebuildSoon(0)
                      K.PG_OUTLINE, K.PG_BG, K.PG_BG_ALPHA -> pagesBar?.applyStyle()
                      else -> if (key.startsWith("tm") && key != K.TM_X && key != K.TM_Y && key != K.TM_ON) timer?.applyStyle()
                  }
              }

              // ------------------------------------------------------------------ helpers
              fun screen(): Point {
                  val pt = Point()
                  @Suppress("DEPRECATION")
                  wm.defaultDisplay.getRealSize(pt)
                  return pt
              }

              fun attachDrag(
                  v: View, lp: WindowManager.LayoutParams, root: View,
                  onTap: () -> Unit, onLong: (() -> Unit)?, onDone: () -> Unit
              ) {
                  val slop = ViewConfiguration.get(this).scaledTouchSlop
                  var dx = 0f; var dy = 0f; var sx = 0; var sy = 0
                  var moved = false; var longFired = false
                  val longRun = Runnable { longFired = true; onLong?.invoke() }
                  v.setOnTouchListener { _, e ->
                      when (e.actionMasked) {
                          MotionEvent.ACTION_DOWN -> {
                              dx = e.rawX; dy = e.rawY; sx = lp.x; sy = lp.y
                              moved = false; longFired = false
                              if (onLong != null) handler.postDelayed(longRun, 450)
                          }
                          MotionEvent.ACTION_MOVE -> {
                              if (!moved && (abs(e.rawX - dx) > slop || abs(e.rawY - dy) > slop)) {
                                  moved = true; handler.removeCallbacks(longRun)
                              }
                              if (moved) {
                                  val s = screen()
                                  lp.x = (sx + (e.rawX - dx).toInt()).coerceIn(0, max(0, s.x - root.width))
                                  lp.y = (sy + (e.rawY - dy).toInt()).coerceIn(0, max(0, s.y - root.height))
                                  runCatching { wm.updateViewLayout(root, lp) }
                              }
                          }
                          MotionEvent.ACTION_UP -> {
                              handler.removeCallbacks(longRun)
                              if (moved) onDone() else if (!longFired) onTap()
                          }
                          MotionEvent.ACTION_CANCEL -> handler.removeCallbacks(longRun)
                      }
                      true
                  }
              }

              private val saveRun = Runnable { if (p.bool(K.AUTOSAVE)) Store.saveAsync(this, doc) }
              private fun scheduleSave() {
                  handler.removeCallbacks(saveRun)
                  handler.postDelayed(saveRun, 1500)
              }

              private fun updateTouchMode() {
                  val v = dv ?: return
                  val off = WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE
                  drawParams.flags = if (interact || hidden) drawParams.flags or off else drawParams.flags and off.inv()
                  runCatching { wm.updateViewLayout(v, drawParams) }
              }

              private fun setTool(t: DrawView.Tool) {
                  val v = dv ?: return
                  v.tool = t
                  if (t != DrawView.Tool.ERASER) lastTool = t
                  interact = false
                  if (hidden) { hidden = false; v.hidden = false }
                  updateTouchMode()
                  rebuildSoon()
              }

              private fun refreshUndo() {
                  val v = dv ?: return
                  undoView?.alpha = if (v.hasUndo) 1f else 0.35f
                  redoView?.alpha = if (v.hasRedo) 1f else 0.35f
              }

              private fun savePos() {
                  val d = resources.displayMetrics.density
                  hxPx = barParams.x + handleOffX
                  hyPx = barParams.y + handleOffY
                  p.set(K.TB_X, (hxPx / d).toInt())
                  p.set(K.TB_Y, (hyPx / d).toInt())
              }

              // ------------------------------------------------------------------ toolbar
              private val rebuildRun = Runnable { rebuildBar() }

              private fun rebuildSoon(delay: Long = 120) {
                  handler.removeCallbacks(rebuildRun)
                  handler.postDelayed(rebuildRun, delay)
              }

              private fun rebuildBar() {
                  val b = bar ?: return
                  val v = dv ?: return
                  b.removeAllViews()
                  undoView = null; redoView = null
                  val cell = dpi(p.int(K.TB_SIZE))
                  val pad = dpi(3)
                  val horizontal = orient == "h"
                  val up = p.str(K.TB_DIR) == "up"
                  b.orientation = if (horizontal) LinearLayout.HORIZONTAL else LinearLayout.VERTICAL
                  b.gravity = Gravity.CENTER
                  b.background = roundBg(withAlpha(p.int(K.TB_COLOR), p.int(K.TB_ALPHA) * 255 / 100), dp(22f))
                  b.setPadding(pad, pad, pad, pad)

                  val fx = p.bool(K.TB_FX)
                  val vib = p.bool(K.TB_VIB)
                  val str = p.int(K.TB_VIB_STR)
                  val views = ArrayList<View>()

                  val handle = IconView(this, Ic.MENU, 0xFFB4BDD0.toInt(), 2.1f, 0.62f)
                  val hw = if (horizontal) (cell * 0.78f).toInt() else cell
                  val hh = if (horizontal) cell else (cell * 0.78f).toInt()
                  handle.layoutParams = LinearLayout.LayoutParams(hw, hh)
                  attachDrag(handle, barParams, b, {
                      handler.post { collapsed = !collapsed; if (!collapsed) animateIn = true; rebuildBar() }
                  }, null) { savePos() }
                  views.add(handle)

                  if (!collapsed) {
                      val tool = v.tool
                      fun on(t: DrawView.Tool) = tool == t && !interact

                      fun add(view: View, click: (View) -> Unit, long: ((View) -> Unit)? = null) {
                          view.layoutParams = LinearLayout.LayoutParams(cell, cell)
                          view.setOnClickListener { click(view) }
                          if (long != null) view.setOnLongClickListener { long(view); true }
                          Fx.attach(view, fx, vib, str)
                          views.add(view)
                      }

                      fun icon(ic: Ic, active: Boolean, tint: Int = C.ON_DARK): IconView =
                          IconView(this, ic, if (active) 0xFFFFFFFF.toInt() else tint, 1.9f, 0.56f).also {
                              if (active) it.background = roundBg(withAlpha(C.ACCENT, 190), dp(13f), C.ACCENT, dp(1.5f))
                          }

                      // fixed: pen, eraser, undo. Pen shows an arrow while touches go to the app below;
                      // tap the pen again to switch between writing and the arrow.
                      add(
                          if (interact) icon(Ic.CURSOR, false, 0xFFFFB020.toInt()) else icon(Ic.PEN, on(DrawView.Tool.PEN)),
                          {
                              if (dv?.tool == DrawView.Tool.PEN && !interact) {
                                  interact = true; updateTouchMode(); rebuildSoon()
                              } else setTool(DrawView.Tool.PEN)
                          },
                          { penPanel(it) }
                      )
                      add(icon(Ic.ERASER, on(DrawView.Tool.ERASER)), { setTool(DrawView.Tool.ERASER) }, { eraserPanel(it) })
                      val u = icon(Ic.UNDO, false)
                      undoView = u
                      add(u, { dv?.undo() })

                      for (item in p.enabledItems()) {
                          when (item.id) {
                              "redo" -> { val r = icon(Ic.REDO, false); redoView = r; add(r, { dv?.redo() }) }
                              "color" -> add(DotView(this, 0, p.int(K.PEN_COLOR)), { penPanel(it) })
                              "size" -> add(DotView(this, 1, C.ON_DARK, p.int(K.PEN_W).toFloat()), { sizePanel(it, K.PEN_W, 1, 30, p.int(K.PEN_COLOR)) })
                              "hl" -> add(icon(Ic.HL, on(DrawView.Tool.HL)), { setTool(DrawView.Tool.HL) }, { sizePanel(it, K.HL_W, 8, 60, p.int(K.PEN_COLOR)) })
                              "shapes" -> add(icon(Ic.SHAPES, on(DrawView.Tool.SHAPE)), { shapesPanel(it) })
                              "select" -> add(icon(Ic.SELECT, on(DrawView.Tool.SELECT)), { setTool(DrawView.Tool.SELECT) })
                              "laser" -> add(icon(Ic.LASER, on(DrawView.Tool.LASER)), { setTool(DrawView.Tool.LASER) })
                              "eye" -> add(icon(if (hidden) Ic.EYE_OFF else Ic.EYE, hidden), {
                                  hidden = !hidden; dv?.hidden = hidden; updateTouchMode(); rebuildSoon()
                              })
                              "orient" -> add(icon(Ic.ORIENT, false), {
                                  orient = if (orient == "h") "v" else "h"
                                  p.set(K.LAST_ORIENT, orient)
                                  rebuildSoon()
                              })
                              "pages" -> add(icon(Ic.PAGES, pagesBar?.visible == true), {
                                  pagesBar?.toggle(); rebuildSoon()
                              }, { pagesPanel(it) })
                              "timer" -> add(icon(Ic.TIMER, timer?.visible == true), {
                                  timer?.toggle(); rebuildSoon()
                              }, { timerPanel(it) })
                              "save" -> add(icon(Ic.SAVE, false), { saveImage() })
                              "clear" -> add(icon(Ic.TRASH, false), { dv?.clearPage() })
                              "close" -> add(icon(Ic.CLOSE, false, 0xFFFF6B6B.toInt()), { stopSelf() })
                          }
                      }
                  }
                  // "up": the handle sits at the far end and the buttons open towards the start
                  if (up) views.reverse()
                  for (x in views) b.addView(x)
                  refreshUndo()

                  // ---- placement: the window is computed around the handle, so the handle never jumps
                  var sumW = 0; var sumH = 0; var maxW = 0; var maxH = 0
                  for (x in views) {
                      val l = x.layoutParams
                      sumW += l.width; sumH += l.height
                      maxW = max(maxW, l.width); maxH = max(maxH, l.height)
                  }
                  val winW = if (horizontal) sumW + 2 * pad else maxW + 2 * pad
                  val winH = if (horizontal) maxH + 2 * pad else sumH + 2 * pad
                  var before = 0
                  for (x in views) {
                      if (x === handle) break
                      before += if (horizontal) x.layoutParams.width else x.layoutParams.height
                  }
                  handleOffX = pad + if (horizontal) before else (winW - 2 * pad - hw) / 2
                  handleOffY = pad + if (horizontal) (winH - 2 * pad - hh) / 2 else before
                  val sz = screen()
                  barParams.x = (hxPx - handleOffX).coerceIn(0, max(0, sz.x - winW))
                  barParams.y = (hyPx - handleOffY).coerceIn(0, max(0, sz.y - winH))
                  hxPx = barParams.x + handleOffX
                  hyPx = barParams.y + handleOffY
                  if (b.isAttachedToWindow) runCatching { wm.updateViewLayout(b, barParams) }

                  // ---- gentle staggered entrance when the buttons open
                  if (animateIn) {
                      animateIn = false
                      val shift = dp(12f) * (if (up) 1f else -1f)
                      var i = 0
                      for (x in views) {
                          if (x === handle) continue
                          x.alpha = 0f
                          x.scaleX = 0.82f; x.scaleY = 0.82f
                          if (horizontal) x.translationX = shift else x.translationY = shift
                          val delay = (i * 32L).coerceAtMost(320L)
                          i++
                          b.post {
                              x.animate().alpha(if (x === undoView) (if (dv?.hasUndo == true) 1f else 0.35f) else if (x === redoView) (if (dv?.hasRedo == true) 1f else 0.35f) else 1f)
                                  .scaleX(1f).scaleY(1f).translationX(0f).translationY(0f)
                                  .setStartDelay(delay).setDuration(210)
                                  .setInterpolator(android.view.animation.DecelerateInterpolator(1.5f)).start()
                          }
                      }
                  }
              }

              private fun saveImage() {
                  val bmp = dv?.renderBitmap() ?: return
                  Thread {
                      val ok = Store.exportPng(this, bmp)
                      handler.post {
                          Toast.makeText(this, if (ok) "Saved to Pictures/Penta" else "Could not save image", Toast.LENGTH_SHORT).show()
                      }
                  }.start()
              }

              // ------------------------------------------------------------------ panels
              fun dismissPanel() {
                  panelRoot?.let { runCatching { wm.removeView(it) } }
                  panelRoot = null
                  val cb = panelDismiss
                  panelDismiss = null
                  cb?.invoke()
              }

              fun showPanel(anchor: View, content: View, onDismiss: () -> Unit = {}) {
                  dismissPanel()
                  val scrim = object : FrameLayout(this) {
                      override fun onTouchEvent(e: MotionEvent): Boolean {
                          if (e.actionMasked == MotionEvent.ACTION_DOWN) dismissPanel()
                          return true
                      }
                  }
                  val card = FrameLayout(tc).apply {
                      background = roundBg(C.PANEL, dp(18f))
                      setPadding(dpi(14), dpi(4), dpi(14), dpi(14))
                      isClickable = true
                      addView(content)
                  }
                  val cardLp = FrameLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT)
                  scrim.addView(card, cardLp)

                  val sz = screen()
                  card.measure(
                      View.MeasureSpec.makeMeasureSpec(sz.x - dpi(16), View.MeasureSpec.AT_MOST),
                      View.MeasureSpec.makeMeasureSpec(sz.y - dpi(16), View.MeasureSpec.AT_MOST)
                  )
                  val w = card.measuredWidth
                  val h = card.measuredHeight
                  val loc = IntArray(2)
                  anchor.getLocationOnScreen(loc)
                  var x: Int
                  var y: Int
                  if (orient == "v" && anchor.parent === bar) {
                      x = loc[0] + anchor.width + dpi(8)
                      if (x + w > sz.x - dpi(8)) x = loc[0] - w - dpi(8)
                      y = loc[1]
                  } else {
                      x = loc[0]
                      y = loc[1] + anchor.height + dpi(8)
                      if (y + h > sz.y - dpi(8)) y = loc[1] - h - dpi(8)
                  }
                  cardLp.leftMargin = x.coerceIn(dpi(8), max(dpi(8), sz.x - w - dpi(8)))
                  cardLp.topMargin = y.coerceIn(dpi(8), max(dpi(8), sz.y - h - dpi(8)))

                  val lp = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.MATCH_PARENT, WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                          WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      PixelFormat.TRANSLUCENT
                  )
                  wm.addView(scrim, lp)
                  panelRoot = scrim
                  panelDismiss = onDismiss
              }

              private fun refreshable(anchor: View, build: (() -> Unit) -> View) {
                  val holder = FrameLayout(tc)
                  lateinit var refresh: () -> Unit
                  refresh = { holder.removeAllViews(); holder.addView(build(refresh)) }
                  holder.addView(build(refresh))
                  holder.minimumWidth = dpi(260)
                  showPanel(anchor, holder)
              }

              private fun swatchRow(colors: List<Int>, current: Int, onPick: (Int) -> Unit, onLong: ((Int, Int) -> Unit)? = null): LinearLayout {
                  val row = PUi.hrow(tc)
                  for ((i, col) in colors.withIndex()) {
                      val s = PUi.swatch(tc, col, col == current)
                      s.setOnClickListener { onPick(col) }
                      if (onLong != null) s.setOnLongClickListener { onLong(i, col); true }
                      row.addView(s)
                  }
                  return row
              }

              private fun penPanel(anchor: View) {
                  refreshable(anchor) { refresh ->
                      val col = PUi.vcol(tc)
                      val cur = p.int(K.PEN_COLOR)
                      col.addView(PUi.title(tc, "COLOUR"))
                      val pal = C.PALETTE.toList()
                      for (r in 0..1) {
                          col.addView(swatchRow(pal.subList(r * 8, r * 8 + 8), cur, { p.set(K.PEN_COLOR, it); refresh() }))
                      }
                      col.addView(PUi.title(tc, "FAVOURITES  ·  LONG-PRESS TO SAVE CURRENT"))
                      val favs = p.favs()
                      col.addView(swatchRow(favs, cur, { p.set(K.PEN_COLOR, it); refresh() }) { i, _ ->
                          val l = p.favs()
                          if (i < l.size) { l[i] = cur; p.setFavs(l); refresh() }
                      })
                      col.addView(PUi.title(tc, "THICKNESS"))
                      col.addView(PUi.sizeRow(tc, p, K.PEN_W, 1, 30, cur))
                      col
                  }
              }

              private fun sizePanel(anchor: View, key: String, min: Int, max: Int, color: Int) {
                  val col = PUi.vcol(tc)
                  col.minimumWidth = dpi(240)
                  col.addView(PUi.title(tc, if (key == K.HL_W) "HIGHLIGHTER THICKNESS" else "PEN THICKNESS"))
                  col.addView(PUi.sizeRow(tc, p, key, min, max, color))
                  showPanel(anchor, col)
              }

              private fun eraserPanel(anchor: View) {
                  val col = PUi.vcol(tc)
                  col.minimumWidth = dpi(270)
                  col.addView(PUi.title(tc, "ERASER TYPE"))
                  col.addView(PUi.seg(tc, listOf("area" to "Area", "stroke" to "Whole stroke"), p.str(K.ER_TYPE)) { p.set(K.ER_TYPE, it) })
                  col.addView(PUi.title(tc, "ERASER SIZE"))
                  col.addView(PUi.sizeRow(tc, p, K.ER_W, 8, 80, C.ON_DARK))
                  col.addView(PUi.title(tc, "AFTER ERASING"))
                  col.addView(PUi.switchRow(tc, "Switch back to pen", p.bool(K.ER_AUTO)) { p.set(K.ER_AUTO, it) })
                  showPanel(anchor, col)
              }

              private fun timerPanel(anchor: View) {
                  refreshable(anchor) { refresh ->
                      val col = PUi.vcol(tc)
                      fun gap(v: View): View = v.also { it.setPadding(0, dpi(5), 0, dpi(5)) }
                      col.addView(PUi.title(tc, "BUBBLE SIZE"))
                      val sizeRow = PUi.hrow(tc)
                      sizeRow.addView(PUi.text(tc, "A", 11f, 0xFF8A94A8.toInt()), PUi.lpW(tc, ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT, 0f, 2))
                      sizeRow.addView(PUi.slider(tc, 10, 40, p.int(K.TM_SIZE)) { p.set(K.TM_SIZE, it) },
                          LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f))
                      sizeRow.addView(PUi.text(tc, "A", 20f, 0xFF8A94A8.toInt()), PUi.lpW(tc, ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT, 0f, 2))
                      col.addView(sizeRow)
                      col.addView(PUi.title(tc, "BUTTONS ON THE BUBBLE"))
                      col.addView(gap(PUi.switchRow(tc, "Question tag (Next)", p.bool(K.TM_LOG)) { p.set(K.TM_LOG, it) }))
                      col.addView(gap(PUi.switchRow(tc, "Reset button", p.bool(K.TM_SHOW_RESET)) { p.set(K.TM_SHOW_RESET, it) }))
                      col
                  }
              }

              private fun pagesPanel(anchor: View) {
                  refreshable(anchor) { refresh ->
                      val col = PUi.vcol(tc)
                      col.addView(PUi.title(tc, "PAGE BAR LOOK"))
                      col.addView(PUi.switchRow(tc, "Black outline", p.bool(K.PG_OUTLINE)) { p.set(K.PG_OUTLINE, it) }.also { it.setPadding(0, dpi(4), 0, dpi(4)) })
                      col.addView(PUi.title(tc, "BACKGROUND DARKNESS  ·  0 = NONE"))
                      val row = PUi.hrow(tc)
                      val label = PUi.text(tc, "${p.int(K.PG_BG_ALPHA)}%", 12f, 0xFF8A94A8.toInt()).apply { gravity = Gravity.END }
                      row.addView(PUi.slider(tc, 0, 100, p.int(K.PG_BG_ALPHA)) { v -> p.set(K.PG_BG_ALPHA, v); label.text = "$v%" },
                          LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f))
                      row.addView(label, PUi.lpW(tc, 40, ViewGroup.LayoutParams.WRAP_CONTENT))
                      col.addView(row)
                      col.addView(PUi.title(tc, "BACKGROUND COLOUR"))
                      val cur = p.int(K.PG_BG)
                      val pal = C.PALETTE.toList()
                      for (r in 0..1) col.addView(swatchRow(pal.subList(r * 8, r * 8 + 8), cur, { p.set(K.PG_BG, it); refresh() }))
                      col
                  }
              }

              private fun shapesPanel(anchor: View) {
                  val col = PUi.vcol(tc)
                  col.addView(PUi.title(tc, "DRAW A SHAPE"))
                  val row = PUi.hrow(tc)
                  val defs = listOf(Ic.PEN to -1, Ic.LINE to 0, Ic.RECT to 1, Ic.OVAL to 2, Ic.ARROW to 3)
                  for ((ic, kind) in defs) {
                      row.addView(PUi.iconBtn(tc, ic, C.ON_DARK, 44) {
                          if (kind < 0) setTool(DrawView.Tool.PEN) else { dv?.shape = kind; setTool(DrawView.Tool.SHAPE) }
                          dismissPanel()
                      })
                  }
                  col.addView(row)
                  col.addView(PUi.text(tc, "First button = freehand pen", 11f, 0xFF8A94A8.toInt()).apply { setPadding(0, dpi(6), 0, 0) })
                  showPanel(anchor, col)
              }

              // ---- pages (used by the floating page bar)
              fun pageNumber(): Int = doc.cur + 1
              fun pageTotal(): Int = doc.pages.size

              private fun gotoPage(i: Int) {
                  if (i < 0 || i >= doc.pages.size) return
                  doc.cur = i
                  dv?.pageChanged()
                  scheduleSave()
                  refreshUndo()
              }

              fun changePage(delta: Int) = gotoPage(doc.cur + delta)

              fun addPage() {
                  doc.pages.add(doc.cur + 1, Page())
                  gotoPage(doc.cur + 1)
              }

              fun deletePage() {
                  if (doc.pages.size > 1) {
                      doc.pages.removeAt(doc.cur)
                      doc.cur = doc.cur.coerceAtMost(doc.pages.size - 1)
                  } else {
                      val pg = doc.pages[0]
                      pg.strokes = ArrayList(); pg.undo.clear(); pg.redo.clear()
                  }
                  dv?.pageChanged(); scheduleSave(); refreshUndo()
              }

              // ------------------------------------------------------------------ teardown
              override fun onDestroy() {
                  handler.removeCallbacksAndMessages(null)
                  if (dv != null) {
                      p.sp.unregisterOnSharedPreferenceChangeListener(this)
                      if (p.bool(K.AUTOSAVE)) Store.saveSync(this, doc)
                      dismissPanel()
                      timer?.destroy()
                      pagesBar?.destroy()
                      bar?.let { runCatching { wm.removeView(it) } }
                      dv?.let { runCatching { wm.removeView(it) } }
                  }
                  dv = null; bar = null; timer = null; pagesBar = null
                  running = false
                  super.onDestroy()
              }
          }
          EOF
      - name: File app/src/main/java/com/example/screenpen/Tile.kt
        run: |
          mkdir -p ScreenPen && cd ScreenPen
          mkdir -p app/src/main/java/com/example/screenpen
          cat > app/src/main/java/com/example/screenpen/Tile.kt <<'EOF'
          package com.example.screenpen

          import android.app.Activity
          import android.app.PendingIntent
          import android.content.Intent
          import android.graphics.drawable.Icon
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.service.quicksettings.Tile
          import android.service.quicksettings.TileService

          /** Quick Settings tile: tap to start or stop Penta without opening the app. */
          class PenTileService : TileService() {

              override fun onStartListening() { refresh() }

              override fun onClick() {
                  if (OverlayService.running) {
                      stopService(Intent(this, OverlayService::class.java))
                      refresh()
                      return
                  }
                  // Starting a foreground service needs a visible activity, so go through a tiny trampoline.
                  val i = Intent(this, TileActivity::class.java).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                  if (Build.VERSION.SDK_INT >= 34) {
                      startActivityAndCollapse(PendingIntent.getActivity(this, 0, i, PendingIntent.FLAG_IMMUTABLE))
                  } else {
                      @Suppress("DEPRECATION")
                      startActivityAndCollapse(i)
                  }
              }

              private fun refresh() {
                  val t = qsTile ?: return
                  t.state = if (OverlayService.running) Tile.STATE_ACTIVE else Tile.STATE_INACTIVE
                  t.label = "Penta"
                  t.icon = Icon.createWithResource(this, android.R.drawable.ic_menu_edit)
                  t.updateTile()
              }
          }

          class TileActivity : Activity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  if (Settings.canDrawOverlays(this)) {
                      startForegroundService(Intent(this, OverlayService::class.java))
                  } else {
                      startActivity(Intent(this, MainActivity::class.java))
                  }
                  finish()
              }
          }
