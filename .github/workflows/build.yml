          package com.example.screenpen

          import android.content.ContentValues
          import android.content.Context
          import android.graphics.Bitmap
          import android.graphics.Matrix
          import android.graphics.Path
          import android.graphics.RectF
          import android.os.Build
          import android.os.Environment
          import android.provider.MediaStore
          import org.json.JSONArray
          import java.io.File

          /** Growable float list. */
          class FL {
              var a = FloatArray(64)
              var n = 0
              fun add(v: Float) {
                  if (n == a.size) a = a.copyOf(n * 2)
                  a[n++] = v
              }
              fun add2(x: Float, y: Float) { add(x); add(y) }
              fun clear() { n = 0 }
              fun toArray(): FloatArray = a.copyOf(n)
          }

          /** kind: 0 = pen (smooth), 1 = highlighter (smooth, translucent), 2 = shape / straight lines. */
          class Stroke(val kind: Int, val color: Int, val width: Float, val pts: FloatArray, val locked: Boolean = false) {
              val count: Int get() = pts.size / 2

              val path: Path by lazy {
                  val p = Path()
                  val n = count
                  if (n > 0) {
                      p.moveTo(pts[0], pts[1])
                      if (n == 1) {
                          p.lineTo(pts[0] + 0.01f, pts[1])
                      } else if (kind == 2 || n == 2) {
                          for (i in 1 until n) p.lineTo(pts[2 * i], pts[2 * i + 1])
                      } else {
                          for (i in 1 until n - 1) {
                              val x = pts[2 * i]
                              val y = pts[2 * i + 1]
                              p.quadTo(x, y, (x + pts[2 * i + 2]) / 2f, (y + pts[2 * i + 3]) / 2f)
                          }
                          p.lineTo(pts[2 * n - 2], pts[2 * n - 1])
                      }
                  }
                  p
              }

              val bounds: RectF by lazy {
                  var l = Float.MAX_VALUE; var t = Float.MAX_VALUE; var r = -Float.MAX_VALUE; var b = -Float.MAX_VALUE
                  for (i in 0 until count) {
                      val x = pts[2 * i]; val y = pts[2 * i + 1]
                      if (x < l) l = x; if (x > r) r = x
                      if (y < t) t = y; if (y > b) b = y
                  }
                  RectF(l, t, r, b)
              }

              fun withLocked(v: Boolean) = Stroke(kind, color, width, pts, v)

              fun transformed(m: Matrix): Stroke {
                  val p = pts.copyOf()
                  m.mapPoints(p)
                  return Stroke(kind, color, width, p, locked)
              }
          }

          class Snap(val before: List<Stroke>, val after: List<Stroke>)

          class Page {
              var strokes = ArrayList<Stroke>()
              val undo = ArrayList<Snap>()
              val redo = ArrayList<Snap>()
          }

          class Doc {
              val pages = ArrayList<Page>().apply { add(Page()) }
              var cur = 0
              val page: Page get() = pages[cur]
          }

          object Store {
              private val lock = Any()

              private fun file(c: Context) = File(c.filesDir, "pages.json")

              fun serialize(doc: Doc): String {
                  val sb = StringBuilder(4096)
                  sb.append("{\"cur\":").append(doc.cur).append(",\"pages\":[")
                  for ((pi, pg) in doc.pages.withIndex()) {
                      if (pi > 0) sb.append(',')
                      sb.append('[')
                      for ((si, s) in pg.strokes.withIndex()) {
                          if (si > 0) sb.append(',')
                          sb.append('[').append(s.kind).append(',').append(s.color).append(',').append(s.width).append(',')
                              .append(if (s.locked) 1 else 0).append(",[")
                          for (i in s.pts.indices) {
                              if (i > 0) sb.append(',')
                              sb.append(Math.round(s.pts[i] * 10f) / 10f)
                          }
                          sb.append("]]")
                      }
                      sb.append(']')
                  }
                  sb.append("]}")
                  return sb.toString()
              }

              fun saveAsync(c: Context, doc: Doc) {
                  val s = serialize(doc)
                  val f = file(c)
                  Thread { synchronized(lock) { runCatching { f.writeText(s) } } }.start()
              }

              fun saveSync(c: Context, doc: Doc) {
                  val s = serialize(doc)
                  synchronized(lock) { runCatching { file(c).writeText(s) } }
              }

              fun deleteSaved(c: Context) {
                  synchronized(lock) { runCatching { file(c).delete() } }
              }

              fun load(c: Context): Doc {
                  val doc = Doc()
                  runCatching {
                      val f = file(c)
                      if (!f.exists()) return doc
                      val root = org.json.JSONObject(f.readText())
                      val pages = root.getJSONArray("pages")
                      doc.pages.clear()
                      for (i in 0 until pages.length()) {
                          val pg = Page()
                          val arr = pages.getJSONArray(i)
                          for (j in 0 until arr.length()) {
                              val s = arr.getJSONArray(j)
                              val pa = s.getJSONArray(4)
                              val pts = FloatArray(pa.length()) { pa.getDouble(it).toFloat() }
                              pg.strokes.add(Stroke(s.getInt(0), s.getInt(1), s.getDouble(2).toFloat(), pts, s.getInt(3) == 1))
                          }
                          doc.pages.add(pg)
                      }
                      if (doc.pages.isEmpty()) doc.pages.add(Page())
                      doc.cur = root.getInt("cur").coerceIn(0, doc.pages.size - 1)
                  }.onFailure {
                      doc.pages.clear(); doc.pages.add(Page()); doc.cur = 0
                  }
                  return doc
              }

              /** Saves a transparent PNG. Returns true on success. */
              fun exportPng(c: Context, bmp: Bitmap): Boolean {
                  val name = "ScreenPen_" + System.currentTimeMillis() + ".png"
                  return runCatching {
                      if (Build.VERSION.SDK_INT >= 29) {
                          val v = ContentValues().apply {
                              put(MediaStore.Images.Media.DISPLAY_NAME, name)
                              put(MediaStore.Images.Media.MIME_TYPE, "image/png")
                              put(MediaStore.Images.Media.RELATIVE_PATH, Environment.DIRECTORY_PICTURES + "/ScreenPen")
                          }
                          val uri = c.contentResolver.insert(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, v)!!
                          c.contentResolver.openOutputStream(uri)!!.use { bmp.compress(Bitmap.CompressFormat.PNG, 100, it) }
                      } else {
                          val dir = c.getExternalFilesDir(Environment.DIRECTORY_PICTURES)!!
                          File(dir, name).outputStream().use { bmp.compress(Bitmap.CompressFormat.PNG, 100, it) }
                      }
                      true
                  }.getOrDefault(false)
              }

              // ---- question log: one line per entry "timestamp,question,ms,targetMs" ----
              private fun logFile(c: Context) = File(c.filesDir, "qlog.txt")

              fun addLog(c: Context, q: Int, ms: Long, target: Long) {
                  synchronized(lock) {
                      runCatching {
                          val f = logFile(c)
                          f.appendText("${System.currentTimeMillis()},$q,$ms,$target\n")
                          val lines = f.readLines()
                          if (lines.size > 400) f.writeText(lines.takeLast(300).joinToString("\n") + "\n")
                      }
                  }
              }

              class LogEntry(val ts: Long, val q: Int, val ms: Long, val target: Long)

              fun readLog(c: Context): List<LogEntry> = synchronized(lock) {
                  runCatching {
                      logFile(c).readLines().mapNotNull {
                          val p = it.split(",")
                          if (p.size < 4) null else LogEntry(p[0].toLong(), p[1].toInt(), p[2].toLong(), p[3].toLong())
                      }
                  }.getOrDefault(emptyList())
              }

              fun clearLog(c: Context) {
                  synchronized(lock) { runCatching { logFile(c).delete() } }
              }
          }

          fun fmtTime(msIn: Long, f: String): String {
              val ms = if (msIn < 0) 0 else msIn
              val totalS = ms / 1000
              return when (f) {
                  "hms" -> String.format("%02d:%02d:%02d", totalS / 3600, (totalS % 3600) / 60, totalS % 60)
                  "mst" -> String.format("%02d:%02d.%d", totalS / 60, totalS % 60, (ms % 1000) / 100)
                  "s" -> totalS.toString()
                  else -> String.format("%02d:%02d", totalS / 60, totalS % 60)
              }
          }
