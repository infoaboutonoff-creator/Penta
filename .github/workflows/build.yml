          package com.example.screenpen

          import android.animation.ValueAnimator
          import android.content.Context
          import android.graphics.drawable.GradientDrawable
          import android.os.VibrationEffect
          import android.os.Vibrator
          import android.view.MotionEvent
          import android.view.View
          import kotlin.math.min

          object Haptics {
              private val amps = intArrayOf(0, 40, 90, 150, 210, 255)
              private val times = longArrayOf(0, 12, 16, 22, 30, 40)

              /** strength 1 (soft) to 5 (strong) */
              fun buzz(ctx: Context, strength: Int) {
                  val v = ctx.applicationContext.getSystemService(Context.VIBRATOR_SERVICE) as? Vibrator ?: return
                  if (!v.hasVibrator()) return
                  val s = strength.coerceIn(1, 5)
                  runCatching { v.vibrate(VibrationEffect.createOneShot(times[s], amps[s])) }
              }
          }

          object Fx {
              private fun glowOf(v: View): GradientDrawable {
                  (v.foreground as? GradientDrawable)?.let { return it }
                  val d = GradientDrawable()
                  d.setColor(C.ACCENT)
                  d.cornerRadius = v.context.dp(13f)
                  d.alpha = 0
                  v.foreground = d
                  return d
              }

              /** Glow and vibration while a view is being touched (for toolbar buttons). */
              fun attach(v: View, glow: Boolean, vib: Boolean, strength: Int) {
                  val d = glowOf(v)
                  d.alpha = 0
                  var anim: ValueAnimator? = null
                  fun fade(to: Int, ms: Long) {
                      anim?.cancel()
                      anim = ValueAnimator.ofInt(d.alpha, to).apply {
                          duration = ms
                          addUpdateListener { d.alpha = it.animatedValue as Int }
                          start()
                      }
                  }
                  v.setOnTouchListener { _, e ->
                      when (e.actionMasked) {
                          MotionEvent.ACTION_DOWN -> {
                              if (vib) Haptics.buzz(v.context, strength)
                              if (glow) {
                                  d.cornerRadius = min(v.width, v.height) / 2.6f
                                  fade(120, 60)
                                  v.animate().scaleX(0.9f).scaleY(0.9f).setDuration(70).start()
                              }
                          }
                          MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> if (glow) {
                              fade(0, 480)
                              v.animate().scaleX(1f).scaleY(1f).setDuration(130).start()
                          }
                      }
                      false
                  }
              }

              /** One quick glow and buzz, for taps that are handled in code (timer). */
              fun pulse(v: View, glow: Boolean, vib: Boolean, strength: Int, roundPct: Int = 100) {
                  if (vib) Haptics.buzz(v.context, strength)
                  if (!glow) return
                  val d = glowOf(v)
                  d.cornerRadius = if (v.width > 0) roundPct.coerceIn(0, 100) / 100f * min(v.width, v.height) / 2f else v.context.dp(12f)
                  ValueAnimator.ofInt(150, 0).apply {
                      duration = 520
                      addUpdateListener { d.alpha = it.animatedValue as Int }
                      start()
                  }
                  v.animate().scaleX(0.92f).scaleY(0.92f).setDuration(80).withEndAction {
                      v.animate().scaleX(1f).scaleY(1f).setDuration(150).start()
                  }.start()
              }
          }
