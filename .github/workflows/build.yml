          package com.example.screenpen

          import android.content.Context
          import android.content.res.ColorStateList
          import android.graphics.Color
          import android.graphics.Typeface
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.widget.LinearLayout
          import android.widget.SeekBar
          import android.widget.Switch
          import android.widget.TextView

          /** Small dark-theme building blocks for the floating panels. */
          object PUi {

              fun title(c: Context, text: String) = TextView(c).apply {
                  this.text = text
                  textSize = 10.5f
                  letterSpacing = 0.08f
                  typeface = Typeface.DEFAULT_BOLD
                  setTextColor(0xFF8A94A8.toInt())
                  setPadding(0, c.dpi(10), 0, c.dpi(6))
              }

              fun text(c: Context, text: String, size: Float = 13f, color: Int = C.ON_DARK) = TextView(c).apply {
                  this.text = text
                  textSize = size
                  setTextColor(color)
              }

              fun hrow(c: Context): LinearLayout = LinearLayout(c).apply {
                  orientation = LinearLayout.HORIZONTAL
                  gravity = Gravity.CENTER_VERTICAL
              }

              fun vcol(c: Context): LinearLayout = LinearLayout(c).apply { orientation = LinearLayout.VERTICAL }

              fun lpW(c: Context, w: Int, h: Int, weight: Float = 0f, margin: Int = 0): LinearLayout.LayoutParams =
                  LinearLayout.LayoutParams(if (w > 0) c.dpi(w) else w, if (h > 0) c.dpi(h) else h, weight).apply {
                      val m = c.dpi(margin)
                      setMargins(m, m, m, m)
                  }

              fun seg(c: Context, options: List<Pair<String, String>>, current: String, onPick: (String) -> Unit): LinearLayout {
                  val box = hrow(c)
                  box.background = roundBg(C.PANEL_ITEM, c.dp(10f))
                  box.setPadding(c.dpi(3), c.dpi(3), c.dpi(3), c.dpi(3))
                  val views = ArrayList<TextView>()
                  fun paint(sel: String) {
                      for ((i, v) in views.withIndex()) {
                          val on = options[i].first == sel
                          v.background = if (on) roundBg(C.ACCENT, c.dp(8f)) else null
                          v.setTextColor(if (on) Color.WHITE else C.ON_DARK)
                      }
                  }
                  for ((key, label) in options) {
                      val v = TextView(c).apply {
                          text = label
                          textSize = 12.5f
                          gravity = Gravity.CENTER
                          setPadding(c.dpi(10), c.dpi(7), c.dpi(10), c.dpi(7))
                          setOnClickListener { paint(key); onPick(key) }
                      }
                      views.add(v)
                      box.addView(v, LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f))
                  }
                  paint(current)
                  return box
              }

              fun slider(c: Context, min: Int, max: Int, value: Int, onChange: (Int) -> Unit): SeekBar = SeekBar(c).apply {
                  this.max = max - min
                  progress = (value - min).coerceIn(0, max - min)
                  progressTintList = ColorStateList.valueOf(C.ACCENT)
                  thumbTintList = ColorStateList.valueOf(C.ACCENT)
                  setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(s: SeekBar?, p: Int, fromUser: Boolean) { if (fromUser) onChange(p + min) }
                      override fun onStartTrackingTouch(s: SeekBar?) {}
                      override fun onStopTrackingTouch(s: SeekBar?) {}
                  })
              }

              /** Slider with a live preview dot and value label. */
              fun sizeRow(c: Context, p: Prefs, key: String, min: Int, max: Int, dotColor: Int): LinearLayout {
                  val row = hrow(c)
                  val dot = DotView(c, 1, dotColor, p.int(key).toFloat())
                  val label = text(c, "${p.int(key)}", 12f, 0xFF8A94A8.toInt()).apply { gravity = Gravity.END }
                  row.addView(dot, lpW(c, 38, 38))
                  row.addView(slider(c, min, max, p.int(key)) { v ->
                      p.set(key, v)
                      dot.value = v.toFloat(); dot.invalidate()
                      label.text = "$v"
                  }, LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f))
                  row.addView(label, lpW(c, 30, ViewGroup.LayoutParams.WRAP_CONTENT))
                  return row
              }

              fun switchRow(c: Context, label: String, on: Boolean, onChange: (Boolean) -> Unit): LinearLayout {
                  val row = hrow(c)
                  row.addView(text(c, label, 13f), LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f))
                  val sw = Switch(c).apply {
                      isChecked = on
                      thumbTintList = ColorStateList.valueOf(Color.WHITE)
                      trackTintList = ColorStateList(
                          arrayOf(intArrayOf(android.R.attr.state_checked), intArrayOf()),
                          intArrayOf(C.ACCENT, 0xFF59627A.toInt())
                      )
                      setOnCheckedChangeListener { _, v -> onChange(v) }
                  }
                  row.addView(sw)
                  return row
              }

              fun swatch(c: Context, color: Int, selected: Boolean, size: Int = 28): View = View(c).apply {
                  background = roundBg(color, c.dp(size / 2f), if (selected) C.ACCENT else 0x44FFFFFF, c.dp(if (selected) 2.5f else 1f))
                  layoutParams = lpW(c, size, size, 0f, 3)
              }

              fun pill(c: Context, label: String, accent: Boolean = false, onClick: () -> Unit): TextView = TextView(c).apply {
                  text = label
                  textSize = 13f
                  gravity = Gravity.CENTER
                  typeface = Typeface.DEFAULT_BOLD
                  setTextColor(Color.WHITE)
                  background = roundBg(if (accent) C.ACCENT else C.PANEL_ITEM, c.dp(10f))
                  setPadding(c.dpi(12), c.dpi(9), c.dpi(12), c.dpi(9))
                  setOnClickListener { onClick() }
              }

              fun iconBtn(c: Context, ic: Ic, tint: Int = C.ON_DARK, size: Int = 38, onClick: () -> Unit): IconView =
                  IconView(c, ic, tint, 2f, 0.56f).apply {
                      background = roundBg(C.PANEL_ITEM, c.dp(10f))
                      layoutParams = lpW(c, size, size, 0f, 2)
                      setOnClickListener { onClick() }
                  }
          }
